[package]
license-file = "../LICENSE"
# Runtime dependency of the published hermit-run CLI.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-run-ptrace"
description = "Hermit's plain ptrace run: the root of Detcore's ptrace instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
reverie = { package = "reverie-core", version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "7fc6cb89d1cf626caae57bd17b138406491e7fb2" }
reverie-ptrace = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "7fc6cb89d1cf626caae57bd17b138406491e7fb2" }
