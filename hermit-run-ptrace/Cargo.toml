[package]
name = "hermit-run-ptrace"
description = "Hermit's plain ptrace run: the root of Detcore's ptrace instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.7"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.7", path = "../detcore" }
reverie = { package = "reverie-core", version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "6a97f0f8993bf2144f199a4283281a7bce136d61" }
reverie-ptrace = { version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "6a97f0f8993bf2144f199a4283281a7bce136d61" }
