[package]
name = "hermit-run-ptrace"
description = "Hermit's plain ptrace run: the root of Detcore's ptrace instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.6"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.6", path = "../detcore" }
reverie = { package = "reverie-core", version = "0.5.6", git = "https://github.com/rrnewton/reverie.git", rev = "4fe5ae7066d2fe18924c9c2c90b79258074bea78" }
reverie-ptrace = { version = "0.5.6", git = "https://github.com/rrnewton/reverie.git", rev = "4fe5ae7066d2fe18924c9c2c90b79258074bea78" }
