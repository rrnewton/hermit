[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "93d3a168bb713b8fc420f591d91b35325a43d1df", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "93d3a168bb713b8fc420f591d91b35325a43d1df" }
