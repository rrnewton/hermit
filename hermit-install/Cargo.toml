[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "9c7b8a1d66f61689002e0a769510eb42d0da7127", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "9c7b8a1d66f61689002e0a769510eb42d0da7127" }
