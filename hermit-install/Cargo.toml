[package]
name = "hermit-install"
version = "0.5.4"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Core staging includes the first-party LiteInst runtime.
default = []

[dependencies]
reverie-liteinst-artifact = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "36af1cc24403e20902fe2ea90fa7e4f199dbf8c2", default-features = false }
serde_json = "1"
toml = "0.8"
