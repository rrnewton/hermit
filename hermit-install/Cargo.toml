[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "22555b2fe7ba9ec688748c4d88e77e5b6fbb52a2", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "22555b2fe7ba9ec688748c4d88e77e5b6fbb52a2" }
