[package]
name = "hermit-install"
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reverie-liteinst-artifact = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "7fc6cb89d1cf626caae57bd17b138406491e7fb2", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "7fc6cb89d1cf626caae57bd17b138406491e7fb2", default-features = false }
reverie-sabre = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "7fc6cb89d1cf626caae57bd17b138406491e7fb2" }
