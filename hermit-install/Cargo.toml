[package]
name = "hermit-install"
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reverie-liteinst-artifact = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "de21652fd25d6575ad6ac9dd1e6d2ff283eb3aa8", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "de21652fd25d6575ad6ac9dd1e6d2ff283eb3aa8", default-features = false }
reverie-sabre = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "de21652fd25d6575ad6ac9dd1e6d2ff283eb3aa8" }
