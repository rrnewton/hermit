[package]
name = "hermit-install"
version = "0.5.6"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Core staging includes the first-party LiteInst runtime.
default = []

[dependencies]
reverie-liteinst-artifact = { version = "0.5.6", git = "https://github.com/rrnewton/reverie.git", rev = "4df5dda5a5ab6e64874c940371e9b83657d56128", default-features = false }
serde_json = "1"
toml = "0.8"
