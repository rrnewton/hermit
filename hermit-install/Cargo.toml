[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "33b35d5b16f9ac2c9ee6f8bb7c3be54ec55f1fea", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "33b35d5b16f9ac2c9ee6f8bb7c3be54ec55f1fea" }
