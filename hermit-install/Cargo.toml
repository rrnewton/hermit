[package]
name = "hermit-install"
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reverie-liteinst-artifact = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "72e8be9a5bf8b567c7f9cd4a3188faadbc91d9d9", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "72e8be9a5bf8b567c7f9cd4a3188faadbc91d9d9", default-features = false }
reverie-sabre = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "72e8be9a5bf8b567c7f9cd4a3188faadbc91d9d9" }
