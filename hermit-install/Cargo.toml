[package]
name = "hermit-install"
version = "0.5.5"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Core staging includes the first-party LiteInst runtime.
default = []

[dependencies]
reverie-liteinst-artifact = { version = "0.5.5", git = "https://github.com/rrnewton/reverie.git", rev = "79345e4953d9bdbdd2f34aedab40f17c15b9e31d", default-features = false }
serde_json = "1"
toml = "0.8"
