[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "1a242a33b927d14a50aeca9488950eac1ad3b4c6", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "1a242a33b927d14a50aeca9488950eac1ad3b4c6" }
