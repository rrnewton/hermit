serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "1880c4e4656c79b1df3a1d1d9ef501013361c607", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "1880c4e4656c79b1df3a1d1d9ef501013361c607" }
