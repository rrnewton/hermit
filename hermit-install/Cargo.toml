[package]
name = "hermit-install"
version = "0.5.4"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Core staging includes LiteInst; full installations opt in explicitly.
default = []
third-party-backends = ["dep:reverie-dbt", "dep:reverie-sabre"]

[dependencies]
reverie-liteinst-artifact = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "a39a5ca1de64cd49cc44ce7c292c91dacafbfe20", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "a39a5ca1de64cd49cc44ce7c292c91dacafbfe20", default-features = false, optional = true }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "a39a5ca1de64cd49cc44ce7c292c91dacafbfe20", optional = true }
