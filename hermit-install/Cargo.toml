toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "68feb9649a5e52b758d1013f9e862e6e36d932e4", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "68feb9649a5e52b758d1013f9e862e6e36d932e4" }
