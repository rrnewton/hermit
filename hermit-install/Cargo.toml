[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "3d6dd4be69a01c7ff80039e7736a350a4e525865", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "3d6dd4be69a01c7ff80039e7736a350a4e525865" }
