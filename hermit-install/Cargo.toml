[package]
name = "hermit-install"
version = "0.5.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["liteinst"]
liteinst = []

[dependencies]
reverie-liteinst-artifact = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "9a9b6ab1824ecee1d1a1285a59ca94c0035bef9c", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "9a9b6ab1824ecee1d1a1285a59ca94c0035bef9c", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "9a9b6ab1824ecee1d1a1285a59ca94c0035bef9c" }
