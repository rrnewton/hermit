serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "e1b54ae6eb90aeb05d745d4d6a159b8f2470ec87", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "e1b54ae6eb90aeb05d745d4d6a159b8f2470ec87" }
