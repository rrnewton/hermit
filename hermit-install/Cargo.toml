[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "522a2f314e3f7310f90a44ea7f18e4706f2f69dc", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "522a2f314e3f7310f90a44ea7f18e4706f2f69dc" }
