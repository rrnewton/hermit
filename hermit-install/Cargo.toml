license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reverie-liteinst-artifact = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "8de33d8f0a64a48a959b0c96e69517fc1230d05d", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "8de33d8f0a64a48a959b0c96e69517fc1230d05d", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "8de33d8f0a64a48a959b0c96e69517fc1230d05d" }
