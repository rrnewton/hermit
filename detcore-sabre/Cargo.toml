[package]
name = "detcore-sabre"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detcore = { version = "0.0.0", path = "../detcore" }
libc = "0.2.186"
reverie = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "640d263353de05ac69c9b975b184306d16973615" }
reverie-memory = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "640d263353de05ac69c9b975b184306d16973615" }
reverie-rpc-transport = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "640d263353de05ac69c9b975b184306d16973615" }
reverie-sabre = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "640d263353de05ac69c9b975b184306d16973615" }
reverie-syscalls = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "640d263353de05ac69c9b975b184306d16973615" }
syscalls = { version = "0.6.7", features = ["serde"] }
