[package]
name = "detcore-sabre"
description = "SaBRe backend glue for Detcore, the Hermit deterministic execution engine."
version = "0.5.4"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.4", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "90f9928cf3a2f6dde48bcd5cba7a52f6669faa76" }
reverie-memory = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "90f9928cf3a2f6dde48bcd5cba7a52f6669faa76" }
reverie-rpc-transport = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "90f9928cf3a2f6dde48bcd5cba7a52f6669faa76" }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "90f9928cf3a2f6dde48bcd5cba7a52f6669faa76" }
reverie-syscalls = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "90f9928cf3a2f6dde48bcd5cba7a52f6669faa76" }
syscalls = { version = "0.6.7", features = ["serde"] }
