[package]
name = "detcore-sabre"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detcore = { version = "0.0.0", path = "../detcore" }
libc = "0.2.186"
reverie = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "da2a5377298bab768b2fa13740788262d9be0b73" }
reverie-memory = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "da2a5377298bab768b2fa13740788262d9be0b73" }
reverie-rpc-transport = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "da2a5377298bab768b2fa13740788262d9be0b73" }
reverie-sabre = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "da2a5377298bab768b2fa13740788262d9be0b73" }
reverie-syscalls = { version = "0.1.0", git = "https://github.com/rrnewton/reverie.git", rev = "da2a5377298bab768b2fa13740788262d9be0b73" }
syscalls = { version = "0.6.7", features = ["serde"] }
