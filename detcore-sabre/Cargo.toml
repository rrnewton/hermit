[package]
name = "detcore-sabre"
description = "SaBRe backend glue for Detcore, the Hermit deterministic execution engine."
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.4.0", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "eda6fd5d4f7d7a08843809daf0a4209fd94c0125" }
reverie-memory = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "eda6fd5d4f7d7a08843809daf0a4209fd94c0125" }
reverie-rpc-transport = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "eda6fd5d4f7d7a08843809daf0a4209fd94c0125" }
reverie-sabre = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "eda6fd5d4f7d7a08843809daf0a4209fd94c0125" }
reverie-syscalls = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "eda6fd5d4f7d7a08843809daf0a4209fd94c0125" }
syscalls = { version = "0.6.7", features = ["serde"] }
