[package]
name = "hermit-run-kvm"
description = "Hermit's KVM run: the root of Detcore's KVM instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.5"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.5", path = "../detcore" }
reverie-kvm = { version = "0.5.5", git = "https://github.com/rrnewton/reverie.git", rev = "832a8b90dadfe16ad7bde1357e3fab5e223d20f7" }
