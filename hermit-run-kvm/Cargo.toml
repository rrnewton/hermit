[package]
name = "hermit-run-kvm"
description = "Hermit's KVM run: the root of Detcore's KVM instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.4.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.4.1", path = "../detcore" }
reverie-kvm = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "b5dd3d16ef5b7ebec7b4a23e9caea14f9c3c6d45" }
