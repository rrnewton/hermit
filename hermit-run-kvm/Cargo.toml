[package]
license-file = "../LICENSE"
# Runtime dependency of the published hermit-run CLI.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-run-kvm"
description = "Hermit's KVM run: the root of Detcore's KVM instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
reverie-kvm = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c" }
