[package]
name = "hermit-run-kvm"
description = "Hermit's KVM run: the root of Detcore's KVM instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.7"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.7", path = "../detcore" }
reverie-kvm = { version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "ca6734b8114719a4cf8ff01a30264ad7dfa01a4f" }
