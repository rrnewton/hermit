[package]
name = "hermit-run-kvm"
description = "Hermit's KVM run: the root of Detcore's KVM instantiation, compiled apart from the hermit library so it builds in parallel."
version = "0.5.4"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.4", path = "../detcore" }
reverie-kvm = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "7091b37ab2e206b01f7939fc3cc0b240aa513676" }
