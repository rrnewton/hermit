# @generated by autocargo from //hermetic_infra/hermit/hermit-cli:[hermit,libhermit]

[package]
license-file = "../LICENSE"
# Third-party backend source trees are never part of the crates.io artifact.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-run"
description = "Hermit: a deterministic Linux execution engine for reproducible runs, record and replay, and concurrency-race search."
version = "0.5.0"
edition = "2024"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/hermit-run"
keywords = ["linux", "hermit", "determinism", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing"]
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"

# libhermit.so is built by hermit-cdylib, so this crate stays an rlib and its
# tests and binaries can start from its metadata.
[lib]
name = "hermit"
crate-type = ["rlib"]

# The 0.5.0 registry release includes ptrace and KVM by default. SaBRe/e9patch
# Rust glue remains optional and requires separately supplied runtime artifacts.
# LiteInst, native-exec and DBT are source-development capabilities on main;
# they are not Cargo features of this registry release. In particular, no
# public dependency requires the unpublished LiteInst registry API.
[features]
# Shared exec-stop observations/cancellation; production release stays refused.
exec-stop-launcher = ["dep:reverie-inguest", "reverie-inguest/exec-stop"]
default = []
# Native controls exercise real KVM ownership/RPC helpers without a VM.
kvm-native-test-support = ["reverie-kvm/native-test-support"]
sabre = ["dep:reverie-rpc-transport", "dep:reverie-sabre-stats"]
e9patch = []
third-party-backends = ["sabre", "e9patch"]
# Hardware qualification selected only by the existing KVM validation nodes.
kvm-execution-tests = []

[dependencies]
anyhow = "1.0.103"
bincode = { version = "2", features = ["serde"] }
addr2line = "0.26.1"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
colored = "2.1.0"
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
detcore-model = { version = "0.5.0", path = "../detcore-model" }
diff = "0.1.13"
dirs = "6.0"
fbinit = "0.2.0"
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
hermit-record = { version = "0.5.0", path = "../hermit-record" }
hermit-record-format = { version = "0.5.0", path = "../hermit-record-format" }
hermit-replay = { version = "0.5.0", path = "../hermit-replay" }
hermit-run-kvm = { version = "0.5.0", path = "../hermit-run-kvm" }
hermit-run-ptrace = { version = "0.5.0", path = "../hermit-run-ptrace" }
hermit-resources = { version = "0.5.0", path = "../hermit-resources" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
libc = "0.2.186"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
num_cpus = "1.16"
object = { version = "0.40.0", features = ["read"] }
pretty_assertions = { version = "1.4.1", features = ["alloc"], default-features = false }
rand = "0.10.2"
rand_pcg = { version = "0.10.2", features = ["serde"] }
regex = "1.13.1"
# Reverie is pinned to a specific commit for reproducibility. Keep this rev in
# sync across all crates and bump it via docs/updating-reverie.md.
reverie = { package = "reverie-core", version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c" }
reverie-kvm = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c" }
reverie-ptrace = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c" }
reverie-inguest = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c", default-features = false, optional = true }
reverie-rpc-transport = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c", optional = true }
reverie-sabre-stats = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c", optional = true }
safeptrace = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
serde_yaml = "0.9.34"
shell-words = "1.1.1"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
uuid = { version = "1.24.0", features = ["rng-getrandom", "serde", "v4", "v5", "v6", "v7", "v8"] }

[dev-dependencies]
# Keep the shared physical-launcher regression in the ordinary unit gate.
reverie-inguest = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "ee9fbe258e39ca90983b840285f684e1bea1762c", default-features = false, features = ["exec-stop"] }
# Exact token locations and digests bind the complete source inventory.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
ruzstd = "0.9.0"
sha2 = "0.10.9"
# Parse actual container call arguments, including conditional local labels.
syn = { version = "2.0.119", features = ["full", "visit"] }

# These source-development suites retain their feature requirement and are
# outside the 0.5.0 registry capability scope. They are not passing release
# evidence; run them on a development tree with the LiteInst feature restored.
[[test]]
name = "liteinst_allocator"
required-features = ["liteinst"]

[[test]]
name = "liteinst_stacks"
required-features = ["liteinst"]

# Retain the source-development code without pretending these are Cargo features.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dbt", "liteinst", "native-exec"))'] }
