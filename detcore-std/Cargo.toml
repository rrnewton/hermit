[package]
name = "detcore-std"
description = "The parts of std that Detcore uses, for building Detcore without std on the Narf kernel target."
version = "0.2.0"
edition = "2024"
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"
publish = false

# The crate is empty on every target except target_os = "none" (see
# src/lib.rs), so its dependencies are declared for that target only and the
# host build compiles none of them.
[target.'cfg(target_os = "none")'.dependencies]
hashbrown = { version = "0.15.5", features = ["default-hasher", "serde"], default-features = false }
libm = { version = "0.2.16", default-features = false }
serde = { version = "1.0.219", features = ["alloc"], default-features = false }
spin = { version = "0.9.8", features = ["lazy", "mutex", "once", "spin_mutex"], default-features = false }
