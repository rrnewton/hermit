[package]
name = "hermit-record"
description = "Hermit's ptrace recording tool, compiled apart from the hermit library so its Detcore instantiation builds in parallel."
version = "0.4.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
hermit-record-format = { version = "0.4.1", path = "../hermit-record-format" }
bincode = { version = "2", features = ["serde"] }
detcore = { package = "hermit-detcore", version = "0.4.1", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "b5dd3d16ef5b7ebec7b4a23e9caea14f9c3c6d45" }
reverie-ptrace = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "b5dd3d16ef5b7ebec7b4a23e9caea14f9c3c6d45" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
tempfile = "3.27.0"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
