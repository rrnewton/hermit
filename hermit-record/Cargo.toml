[package]
license-file = "../LICENSE"
# Runtime dependency of the published hermit-run CLI.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-record"
description = "Hermit's ptrace recording tool, compiled apart from the hermit library so its Detcore instantiation builds in parallel."
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[dependencies]
hermit-record-format = { version = "0.5.0", path = "../hermit-record-format" }
bincode = { version = "2", features = ["serde"] }
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827" }
reverie-ptrace = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
tempfile = "3.27.0"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
