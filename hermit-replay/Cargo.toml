[package]
# Runtime dependency of the published hermit-run CLI.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-replay"
description = "Hermit's ptrace replay tool, compiled apart from the hermit library so its Detcore instantiation builds in parallel."
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[dependencies]
hermit-record-format = { version = "0.5.0", path = "../hermit-record-format" }
anyhow = "1.0.103"
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "72e8be9a5bf8b567c7f9cd4a3188faadbc91d9d9" }
reverie-ptrace = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "72e8be9a5bf8b567c7f9cd4a3188faadbc91d9d9" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

[dev-dependencies]
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
