[package]
name = "hermit-inguest-engine"
description = "Shared compiled in-guest Detcore engine for ordinary native entry shims."
version = "0.5.4"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
name = "hermit_inguest_engine"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[[test]]
name = "loader_state"
path = "tests/loader_state.rs"

[[test]]
name = "native_policy"
path = "tests/native_policy.rs"

[features]
# Diagnostic observations do not choose scheduling/syscall policy or authority.
default = []
dispatch-observer = ["detcore/dispatch-observer"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.4", path = "../detcore" }
libc = "0.2.186"
rand = "0.10.2"
tracing = "0.1.41"
# One exact core source owns the shared ordinary/native Guest and RPC services.
# Native compilation and loader qualification remain separate required gates.
reverie = { package = "reverie-core", version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "4da26737c55781f8e032208a5ca1e022f419f25d" }
reverie-inguest = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "4da26737c55781f8e032208a5ca1e022f419f25d", default-features = false, features = ["coordinator-rpc", "rcb-clock"] }
reverie-liteinst = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "4da26737c55781f8e032208a5ca1e022f419f25d", default-features = false }
reverie-rpc-transport = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "4da26737c55781f8e032208a5ca1e022f419f25d" }
