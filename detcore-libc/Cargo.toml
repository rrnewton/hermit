[package]
name = "detcore-libc"
description = "The libc that Detcore uses when it is built without std for the Narf kernel target."
version = "0.2.0"
edition = "2024"
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"
publish = false

# The crate is empty on every target except target_os = "none" (see
# src/lib.rs), so its dependency is declared for that target only and the host
# build compiles none of it. The Reverie revision is Detcore's pin.
[target.'cfg(target_os = "none")'.dependencies]
reverie = { package = "reverie-core", version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "dbf2b5c8880bac5fd6a06fa1f296b3eec3590569", default-features = false }
