[workspace]
members = [
  "common/digest",
  "common/edit-distance",
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore-dbi",
  "detcore-sabre",
  "detcore-liteinst",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-install",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# LOCAL-ONLY: redirect reverie git deps to the local worktree for KVM fd-table
# investigation. DO NOT COMMIT.
[patch."https://github.com/rrnewton/reverie.git"]
reverie = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie" }
reverie-kvm = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-kvm" }
reverie-ptrace = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-ptrace" }
reverie-rpc-transport = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-rpc-transport" }
reverie-syscalls = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-syscalls" }
reverie-memory = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-memory" }
reverie-process = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-process" }
reverie-util = { path = "/home/newton/work/dev-hermit/worktrees/kvm/reverie/reverie-util" }
