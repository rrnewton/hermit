[workspace]
members = [
  "common/edit-distance",
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore-dbi",
  "detcore-sabre",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-install",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
# Bare `cargo build`/`cargo test` (no `--workspace`) builds only these members.
# The three third-party-dependency crates -- `detcore-dbi` and `hermit-install`
# (pull `reverie-dbi`/DynamoRIO) and `detcore-sabre` (pulls `reverie-sabre`) --
# are deliberately excluded so the default developer build produces the
# `hermit` binary (ptrace/kvm/liteinst) with no DynamoRIO/e9patch/SaBRe
# third-party dependencies. CI opts them back in with `--workspace` plus
# `cargo ... -p hermit --features third-party-backends`.
default-members = [
  "common/edit-distance",
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# MEASUREMENT-ONLY patch (kvm-compat-ratchet, NOT for PR): build against the
# local reverie checkout (worktrees/kvmcompat/reverie @ 79517704 = #355 head +
# the startup-livelock measurement revert) to quantify the post-fix KVM corpus.
[patch."https://github.com/rrnewton/reverie.git"]
reverie-core = { path = "../reverie/reverie" }
reverie-memory = { path = "../reverie/reverie-memory" }
reverie-rpc-transport = { path = "../reverie/reverie-rpc-transport" }
reverie-syscalls = { path = "../reverie/reverie-syscalls" }
reverie-ptrace = { path = "../reverie/reverie-ptrace" }
reverie-kvm = { path = "../reverie/reverie-kvm" }
reverie-dbi = { path = "../reverie/reverie-dbi" }
reverie-liteinst = { path = "../reverie/reverie-liteinst" }
