[workspace]
members = [
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore-dbt",
  "detcore-sabre",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-install",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
# Bare `cargo build`/`cargo test` (no `--workspace`) builds only these members.
# The three third-party-dependency crates -- `detcore-dbt` and `hermit-install`
# (pull `reverie-dbt`/DynamoRIO) and `detcore-sabre` (pulls `reverie-sabre`) --
# are deliberately excluded so the default developer build produces the
# `hermit` binary (ptrace/kvm/liteinst) with no DynamoRIO/e9patch/SaBRe
# third-party dependencies. CI opts them back in with `--workspace` plus
# `cargo ... -p hermit --features third-party-backends`.
default-members = [
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# MEASUREMENT ONLY -- disposable clone. Redirects the pinned reverie rev to a
# local checkout of that SAME rev with C5/C6 determinized, to test whether the
# plugin's getrandom(16) survives. NOT a proposal to move the pin.
[patch."https://github.com/rrnewton/reverie.git"]
reverie-core = { path = "/home/newton/work/dev-hermit/ignored/reverie-hashseed-c261050c/reverie/reverie" }
reverie-memory = { path = "/home/newton/work/dev-hermit/ignored/reverie-hashseed-c261050c/reverie/reverie-memory" }
reverie-rpc-transport = { path = "/home/newton/work/dev-hermit/ignored/reverie-hashseed-c261050c/reverie/reverie-rpc-transport" }
reverie-sabre = { path = "/home/newton/work/dev-hermit/ignored/reverie-hashseed-c261050c/reverie/experimental/reverie-sabre" }
reverie-syscalls = { path = "/home/newton/work/dev-hermit/ignored/reverie-hashseed-c261050c/reverie/reverie-syscalls" }
