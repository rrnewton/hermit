[workspace]
members = [
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore-dbi",
  "detcore-sabre",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-install",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
# Bare `cargo build`/`cargo test` (no `--workspace`) builds only these members.
# The three third-party-dependency crates -- `detcore-dbi` and `hermit-install`
# (pull `reverie-dbi`/DynamoRIO) and `detcore-sabre` (pulls `reverie-sabre`) --
# are deliberately excluded so the default developer build produces the
# `hermit` binary (ptrace/kvm/liteinst) with no DynamoRIO/e9patch/SaBRe
# third-party dependencies. CI opts them back in with `--workspace` plus
# `cargo ... -p hermit --features third-party-backends`.
default-members = [
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# An unconsumed `Result` is a COMPUTED-THEN-IGNORED VALUE: the check ran, the
# verdict was produced, and nothing read it. That is the same shape as a
# denominator that is computed and never consulted, or a counter that exists and
# is never read -- an invariant assertion that drops its status looks like
# verification while asserting nothing. Unlike those, the compiler can make this
# particular version impossible, so it is denied rather than merely warned.
#
# Deny, not warn: the repo runs a zero-warnings policy, and a warning that does
# not fail the build is itself a computed-then-ignored value.
#
# A DELIBERATE discard stays legal but must SAY SO -- `let _ = ...` with a
# comment giving the reason. An unexplained discard is indistinguishable from an
# oversight, which is precisely what this lint exists to separate.
[workspace.lints.rust]
unused_must_use = "deny"
