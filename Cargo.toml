[workspace]
members = [
  "common/edit-distance",
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore-dbi",
  "detcore-sabre",
  "detcore-e9patch",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-install",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
# Bare `cargo build`/`cargo test` (no `--workspace`) builds only these members.
# The three third-party-dependency crates -- `detcore-dbi` and `hermit-install`
# (pull `reverie-dbi`/DynamoRIO) and `detcore-sabre` (pulls `reverie-sabre`) --
# are deliberately excluded so the default developer build produces the
# `hermit` binary (ptrace/kvm/liteinst) with no DynamoRIO/e9patch/SaBRe
# third-party dependencies. CI opts them back in with `--workspace` plus
# `cargo ... -p hermit --features third-party-backends`.
default-members = [
  "common/edit-distance",
  "common/test-allocator",
  "ci/manifest-plan",
  "detcore",
  "detcore-model",
  "detcore/tests/testutils",
  "flaky-tests",
  "hermit-cli",
  "hermit-resources",
  "hermit-verify",
  "tests",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# LOCAL-ONLY BUILD OVERRIDE -- DO NOT COMMIT.
# Redirects every reverie crate to the coordinated reverie #377 child checkout
# (feat/e9patch-hybridptrace-lifecycle-owner @ 4a42194) so the ptrace-free
# e9patch backend builds against the unlanded HybridPtrace lifecycle owner and
# the `install_tool`/`run_direct_with_preload`/`COORDINATOR_ENV` API. The whole
# reverie surface is repointed together to keep a single `reverie-core` in the
# graph. The committed manifests stay pinned at the current workspace reverie
# rev; the coordinator bumps every reverie pin + parent gitlink to the landed
# #377 SHA when the patching cluster lands.
[patch."https://github.com/rrnewton/reverie.git"]
reverie-core = { path = "../reverie/reverie" }
reverie-syscalls = { path = "../reverie/reverie-syscalls" }
reverie-memory = { path = "../reverie/reverie-memory" }
reverie-rpc-transport = { path = "../reverie/reverie-rpc-transport" }
reverie-process = { path = "../reverie/reverie-process" }
reverie-util = { path = "../reverie/reverie-util" }
reverie-ptrace = { path = "../reverie/reverie-ptrace" }
reverie-preload = { path = "../reverie/reverie-preload" }
reverie-e9patch = { path = "../reverie/reverie-e9patch" }
reverie-dbi = { path = "../reverie/reverie-dbi" }
reverie-kvm = { path = "../reverie/reverie-kvm" }
reverie-liteinst = { path = "../reverie/reverie-liteinst" }
reverie-sabre = { path = "../reverie/experimental/reverie-sabre" }
