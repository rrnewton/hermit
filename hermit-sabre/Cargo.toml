[package]
name = "hermit-sabre"
description = "Source-built SaBRe execution plugin for Hermit."
version = "0.2.0"
edition = "2024"
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause AND GPL-3.0-or-later"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "hermit-sabre"
path = "src/main.rs"

[dependencies]
detcore = { version = "0.0.0", path = "../detcore" }
flate2 = "1.1.9"
goblin = "0.10.7"
hex = "0.4.3"
hermit-plugin-protocol = { version = "0.2.0", path = "../hermit-plugin-protocol" }
libc = "0.2.186"
serde_json = "1.0.140"
sha2 = "0.10.6"
tar = "0.4.44"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release.build-override]
opt-level = 3

[build-dependencies]
detcore = { version = "0.0.0", path = "../detcore" }
detcore-sabre = { version = "0.0.0", path = "../detcore-sabre" }
flate2 = "1.1.9"
hex = "0.4.3"
hermit-plugin-protocol = { version = "0.2.0", path = "../hermit-plugin-protocol" }
reverie-sabre = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "91a725384317ce17367de467c196818d6d523583" }
serde_json = "1.0.140"
sha2 = "0.10.6"
tar = "0.4.44"
