[package]
name = "detcore-liteinst"
description = "In-guest LiteInst runtime for Detcore, the Hermit deterministic execution engine."
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

# This crate is a preload runtime, not a testable library. Its `.init_array`
# constructor (src/lib.rs) runs before any Rust test harness and `_exit(127)`s
# when `REVERIE_LITEINST_COORDINATOR` is unset, so a generated unit-test binary
# would abort during `nextest --list`. The test and doctest targets are
# disabled: hermit-cli's in-guest CLI tests run it as a real preload.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# Real-runtime allocation regression; never selects a different allocator.
allocator-fixture = ["reverie-liteinst/allocator-fixture"]
# Private InitialImage entry; ordinary builds retain the loader constructor.
exec-private-init = ["detcore/dispatch-observer", "reverie-liteinst/exec-private-init", "reverie-inguest/exec-private-init", "dep:detcore-model", "dep:reverie-rpc-transport"]

# Native successor injection is outside the 0.5.0 release scope. Its source
# remains for development on main; the private initial-image mode is unchanged.

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.0", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827" }
reverie-inguest = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827", default-features = false }
reverie-liteinst = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827", default-features = false }

detcore-model = { version = "0.5.0", path = "../detcore-model", optional = true }
reverie-rpc-transport = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
sha2 = { version = "0.10.6", optional = true }

[dev-dependencies]
# Native consumer controls are also type-checked by all-target Clippy.
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("exec-native-injection"))'] }
