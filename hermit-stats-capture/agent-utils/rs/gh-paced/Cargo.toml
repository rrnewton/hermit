[package]
name = "gh-paced"
version = "0.1.0"
description = "Client-side rate limiting, content guard and pushback cooldown for the GitHub CLI"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gh-paced"
path = "src/main.rs"

[lib]
name = "gh_paced"
path = "src/lib.rs"

[lints]
workspace = true
