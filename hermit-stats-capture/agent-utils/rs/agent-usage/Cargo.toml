[package]
name = "agent-usage"
version = "0.1.0"
description = "Cheap plan-usage, reset-time and burn-rate readings for the Claude Code and Codex CLIs"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "agent-usage"
path = "src/main.rs"

[lib]
name = "agent_usage"
path = "src/lib.rs"

[lints]
workspace = true
