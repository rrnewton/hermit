[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-landing-planner"
version = "0.1.0"
description = "Produce advisory pull-request landing plans from conflicts, CI health, and freshness."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
license = "MIT"
authors = [{ name = "Ryan Newton" }]
keywords = ["git", "github", "pull-request", "ci", "merge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["mypy", "pytest", "types-PyYAML"]

[project.urls]
Repository = "https://github.com/rrnewton/agent-utils"
Issues = "https://github.com/rrnewton/agent-utils/issues"

[project.scripts]
pr-landing-planner = "pr_landing_planner.cli:main"

[tool.setuptools]
packages = ["pr_landing_planner"]
package-dir = { pr_landing_planner = "." }
include-package-data = false

[tool.setuptools.package-data]
pr_landing_planner = ["py.typed", "README.md", "USER_GUIDE.md", "examples/*.json", "examples/*.yaml"]
