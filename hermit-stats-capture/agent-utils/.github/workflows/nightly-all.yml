name: nightly (everything)

# Routine CI and local validation use the same path selector and flattened DAG. This scheduled run
# supplies the complementary signal: execute every fragment regardless of which paths most recently
# changed, so a latent cross-tool interaction cannot remain hidden indefinitely. Its failure means
# "main is broken", not necessarily "the last commit broke its selected component".

on:
  schedule:
    # 04:17 UTC. Not on the hour: GitHub's scheduler is busiest exactly then, and a nightly that
    # queues for forty minutes reports yesterday's tree as this morning's news.
    - cron: '17 4 * * *'
  workflow_dispatch:

# The notifier CREATES AN ISSUE, and the default token cannot.
#
# Measured on the 2026-08-30 run: `Contents: read, Metadata: read, Packages: read`, and the create
# came back `HttpError: Resource not accessible by integration`. So this failed three nights running
# and told nobody — the one job whose whole purpose is to be noticed was the one that could not
# speak. Narrowest grant that fixes it; `contents: read` is stated rather than inherited so adding
# a write later has to be deliberate.
permissions:
  contents: read
  issues: write

jobs:
  everything:
    runs-on: ubuntu-latest
    # The whole contract, not a selection. If this is routinely hitting the limit, that is a signal
    # about the contract rather than a number to raise.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # THE CONTRACT NEEDS THESE AND THE RUNNER SHIPS NONE OF THEM.
      #
      # `./setup py` runs a strict mypy pass, so `make validate-all` died SIX SECONDS in with
      # "py: mypy not installed" on every run since this workflow landed. A red nightly that had
      # said nothing about main's health for three nights, and — because the notifier was also
      # broken — said it to nobody. The per-tool workflows each install their own tooling, which
      # is exactly why they were green while this was not.
      #
      # `types-PyYAML` because PyYAML ships no stubs and mypy --strict refuses without them.
      #
      # AND THE SAME TRAP A SECOND TIME, for twenty-two consecutive nights. Installing mypy got the
      # gate as far as RUNNING, and then it failed at `lint-and-typecheck (make check)` every night
      # from 2026-09-01 to 2026-09-22 on two errors and only two:
      #
      #   vibe-talk/scripts/screenshots.py:118: Cannot find implementation or library stub for
      #     module named "playwright.sync_api"  [import-not-found]
      #   vibe-talk/scripts/smoke-agent.py:1237: Cannot find implementation or library stub for
      #     module named "websockets"  [import-not-found]
      #
      # The mypy pass is repository-WIDE, so it type-checks vibe-talk's scripts whether or not this
      # job ever runs them, and an optional runtime dependency that is merely imported is still a
      # dependency of the typecheck. Neither package arrives by any other route: the `npx playwright
      # install` below fetches a BROWSER for node, which is a different thing from the Python
      # bindings mypy is looking for.
      #
      # `cross-dagrun.yml` already learned this and already says so in its own install step.
      #
      # AND A THIRD TIME, because the first attempt at this fix copied that line and dropped one
      # package from it. Past the typecheck, `make validate-all` ran for fifty minutes and then
      # failed at the last gate of all:
      #
      #   check_python_packages: FAIL: setuptools.build_meta is unavailable; install
      #     setuptools>=77 in the interpreter running this offline package check
      #   validate: FAILED at packages (make check-packages)
      #
      # `setuptools>=77` was right there in the line being copied. Python 3.12 no longer ships
      # setuptools in a fresh venv, and the offline package check needs its PEP 517 backend.
      #
      # So this line is now LITERALLY the same line, character for character, and that is the
      # point: two jobs running the same strict gate should not be installing two different sets
      # of things for it, and "the same, roughly" is how this job stayed red for three weeks. If
      # one of them gains a dependency, both do.
      - name: install the tooling the contract runs on
        run: python -m pip install --upgrade 'setuptools>=77' mypy 'playwright==1.61.0' pytest pyyaml types-PyYAML 'websockets>=12'

      # vibe-talk's generated wire contract is checked for staleness and voice.js is type-checked
      # against it, both with the generator's pinned, lockfile-installed tools (Ajv, TypeScript).
      - name: install the vibe-talk contract tools
        run: npm ci --prefix vibe-talk/contract --no-audit --no-fund

      # The timeline's browser checks drive a real Chromium, so the runner needs the browser and
      # the suite's dependencies before `validate-all` reaches them. Named as its own step so a
      # download failure reads as a download failure rather than as a test failure.
      - name: browser for the timeline suite
        working-directory: py/tests/js/browser
        run: |
          # `npm install`, not `npm ci`: this directory deliberately tracks no lockfile and no
          # node_modules (see its README), so there is nothing for `ci` to install from.
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # `--all` rather than the selector: selection is a convenience for the edit-run loop, and
      # this job exists precisely to run what selection would have skipped.
      #
      # BOX_FLAGS lets the boxed steps degrade instead of refusing. A hosted runner may not
      # delegate a cgroup, and `dagrun` hard-fails rather than pretending to enforce a bound it
      # cannot -- which is right locally and wrong here, where the alternative is not running the
      # test at all. The degradation is partial, not total: `dagrun capabilities` reports
      # `wall_timeout` available uncontained, so the ceiling that catches a hang still holds and
      # only the memory/CPU bound is lost, which the runner enforces its own way.
      #
      # The lost bound also means cross/differential.py cannot run its boxing checks here. The
      # lane declares that it is partial for them: they are listed as SKIPPED/UNVERIFIED and the
      # run ends with PARTIAL rather than OK. The step still passes, so validate.py also emits a
      # warning annotation and a job-summary entry for PARTIAL. Boxing coverage comes from local
      # boxed validation.
      # Hosted runners also have fewer than eight CPUs, so the CPA planner's memory-cap check
      # (which needs a core budget of eight) is skipped as eight-cpu and is covered locally.
      - name: the entire portable current-toolchain contract
        env:
          BOX_FLAGS: --allow-cgroup-failure
          AGENT_UTILS_CROSS_ALLOW_SKIP: boxing,eight-cpu
        run: make validate-all

      # Same reasoning as the per-push workflow: the gate is a completely-broken detector, so the
      # value of the nightly run is the SERIES, and a series has to be kept to be a series.
      - name: keep the benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-redraw-benchmark-nightly-${{ github.run_id }}
          path: py/tests/js/browser/benchmark-report.txt
          if-no-files-found: ignore
          retention-days: 90

      # A failure here is about MAIN, not about a pull request, so it has to reach somebody. An
      # issue rather than a silent red tick on a page nobody opens in the morning.
      - name: say so, on main, where it will be seen
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `nightly-all: the portable contract failed on main`;
            // One open issue, not one per night: a nightly that has been red for a week should be
            // a single thread with a week of comments, not seven issues nobody closes.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly',
            });
            const body = [
              `[github-actions] The nightly portable-contract run failed on \`main\`.`,
              ``,
              `Commit: ${context.sha}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Push CI uses the repository's dependency-aware selector. This nightly additionally`,
              `forces every gate, so it can expose a dependency edge the selector does not yet`,
              `encode, accumulated state, or environment-sensitive behavior.`,
            ].join('\n');
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['nightly'],
                body,
              });
            }
