description: Tool-owned offline Python build-and-install smoke checks

resource_caps:
  python-package: 4

steps:
  - group: python
    job: agentctl
    desc: build and smoke-install the agentctl Python distribution
    cmd: python3 scripts/check_python_packages.py --project agentctl
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-agentctl]
    timeout: 600
    hint: &python_package_hint
      resources: {python-package: 1}
      est_duration_s: 8
      classification: cpu-bound
      preferred_inner_jobs: 1
      rss_baseline_bytes: 1073741824

  - group: python
    job: dagrun
    desc: build and smoke-install the dagrun Python distribution
    cmd: python3 scripts/check_python_packages.py --project dagrun
    jobs_flag: ""
    labels: [validation-packages, validation-python-packages, component-dagrun]
    timeout: 600
    hint: *python_package_hint

  - group: python
