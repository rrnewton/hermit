[package]
name = "tick-hub"
version = "0.2.0"
description = "Run one scheduled tick that evaluates cadenced reminders and emits machine-readable health and action lines."
readme = "README.md"
keywords = ["scheduler", "automation", "reminders", "health-checks"]
categories = ["command-line-utilities", "development-tools"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/rrnewton/agent-utils"
authors = ["Ryan Newton"]

[dependencies]
glob = "0.3"
indexmap = "2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "tick-hub"
path = "src/main.rs"

[lib]
name = "tick_hub"
path = "src/lib.rs"

[lints]
workspace = true
