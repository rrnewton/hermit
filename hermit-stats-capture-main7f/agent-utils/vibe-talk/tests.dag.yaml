  # `#243 filter-keeps-selection` in the browser engine, the owner's own sequence at 1280x800 with a
  # mouse and at 412x915 with a finger: search, Pinned, a pin chosen, the filter cleared -- the pin's row
  # in the channel's list stands where it stood in the Pinned list, within a pixel, and half a second
