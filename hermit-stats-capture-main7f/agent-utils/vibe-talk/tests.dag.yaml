  # Measured on 2026-10-12: about 6s wall.
  - group: check
    job: bookmark-browser
    desc: the reading bookmark set, jumped to, kept across a reply and advanced by Done, in current Chromium at 1280x800 and 412x915
    labels: [validation-vibe-talk]
