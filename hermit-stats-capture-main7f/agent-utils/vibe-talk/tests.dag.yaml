  - group: check
    job: filter-place-browser
    desc: a pin chosen under Pinned stays where it stood when the filter is cleared, an old one walked back to, a combined row's second part by its own text, and a message the reader opens next stays put, in current Chromium at 1280x800 and 412x915
    labels: [validation-vibe-talk]
