  # THE ONE THAT LEAKED. It starts a real server and drives a real Chromium at it. Boxed, its
  # descendants are reaped with it whether or not the script's own trap fires -- which is the whole
  # reason this file exists, because for six days that trap did not.
  - group: shots
    job: screenshots
    desc: the screenshot harness — a real server and a real browser
    labels: [validation-vibe-talk]
    cmd: cd vibe-talk && ./scripts/run.sh --screenshots --theme dark
    jobs_flag: ""
    deps: [build.release]
    # Wall, not only CPU: a browser waiting on a page that never loads burns no CPU at all, so a
    # CPU budget alone would let it hang until the run timeout. This is the hang backstop.
    timeout: 900
    cpu_timeout: 600
    hint:
      resources: {browser: 1}
      # MEASURED, not guessed. Everything in this block used to be an estimate for a step that had
      # never once started -- the `cmd` above did not parse, so the job failed in milliseconds and
      # no profile of it could exist. The first run that got through put the walk at 284s wall,
      # 170s CPU and a 682MB peak, against guesses of 120s and 4GiB. Both were wrong by more than
      # a factor of two, in opposite directions, which is the worst way for a scheduler estimate
      # to be wrong: it under-books the time and over-books the memory at the same time.
      #
      # 300 rather than 284 because this is a whole-walk figure and the walk grows a state at a
      # time; re-measure with `dagrun run --dag vibe-talk/tests.dag.yaml --selected
      # shots.screenshots --ignore-selected-deps` and read `.dagrun/profiles/step_profiles_*.csv`.
      # Unusually for this file, the number travels: at 0.60 effective cores this step is waiting,
      # not computing, so a slower machine does not stretch it the way it stretches clippy.
      est_duration_s: 300
      # latency-bound, not cpu-bound: most of its wall time is waiting for a page to settle, and
      # telling the scheduler otherwise makes it reserve cores it will not use. Confirmed by the
      # same run -- 0.60 effective cores over 284 seconds.
      classification: latency-bound
      preferred_inner_jobs: 4
      # 1GiB against a 682MB observed peak.
      #
      # This is NOT what the planner reserves for this step, and a previous version of this
      # comment said it was. `sizing.step_mem_cap_bytes` is "an explicit hard cap wins; otherwise
      # factor x the RSS baseline" -- so while `hard_mem_max_bytes` below is set, the baseline is
      # never consulted for the footprint sum. It is still worth being true: the visualiser reads
      # it, and `--refine-memory` compares profile-derived peaks against it.
      rss_baseline_bytes: 1073741824
      # THE CAP IS THE RESERVATION. That is the part worth knowing before making this number
      # comfortable: because an explicit cap wins outright, whatever is written here is what
      # `schedulable_peak_mem_bytes` adds up when it decides how many steps may run at once. A cap
      # set high "just to be safe" is not free -- it is spent against the run's memory budget for
      # the step's whole duration, which is the serialization #113 dagrun-memory-admission is
      # about, and this step is held for 284 seconds at a time.
      #
      # So: a backstop sized from the measurement rather than from imagination. 3GiB is 4.4x the
      # observed 682MB peak, which still catches a browser that genuinely runs away -- the thing
      # this cap exists for -- while reserving half of what 6GiB did. Re-measure before lowering
      # it further; `peak_bytes` in the profile CSV is the column.
      hard_mem_max_bytes: 3221225472
