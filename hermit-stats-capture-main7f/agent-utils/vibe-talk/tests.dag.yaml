  # `#249 search-highlight`, `#250 date-separators` and `#251 author-filter` in the browser engine, at
  # 1280x800 with a mouse and 412x915 and 360x800 with a finger, over a week of a channel read at a fixed
  # noon in New York's zone: eight day rules in the owner's words ("Today, Oct 12, Mon"), each between
  # its row and the one above, the bookmark's line nearer its message than its day's rule; "engine"
  # leaves four messages, each hit lit in the highlighter's colour once the typing pauses, the link found
  # by its address outlined, a folded answer's hit said under it, and each gap's line saying the days it
