<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Make "system-ui" / "sans-serif" resolve to Droid Sans, the font an Android phone of the
     Droid era drew its interface in, instead of the recording host's default sans-serif. Only
     record_demo.py's Chromium sees this file (FONTCONFIG_FILE); the page and its CSS are
     unchanged. Without Droid Sans installed, fontconfig falls back to the host's default. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Droid Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Droid Sans</string></edit>
  </match>
</fontconfig>
