[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-hub"
version = "0.2.0"
description = "Evaluate cadenced reminders and health checks in one deterministic scheduled tick."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Newton" }]
keywords = ["automation", "scheduler", "health-check", "reminders"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["mypy", "pytest", "types-PyYAML"]

[project.urls]
Repository = "https://github.com/rrnewton/agent-utils"
Issues = "https://github.com/rrnewton/agent-utils/issues"

[project.scripts]
tick-hub = "tick_hub.cli:main"

[tool.setuptools]
packages = ["tick_hub"]
package-dir = { tick_hub = "." }
include-package-data = false

[tool.setuptools.package-data]
tick_hub = ["py.typed", "README.md", "USER_GUIDE.md", "examples/*.json", "examples/*.yaml"]
