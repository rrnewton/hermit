nextest-version = "0.9.100"

[profile.default]
fail-fast = false
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
# This is the per-test-process bound, below the enclosing DAG node's batch
# bound. Hermit failures commonly stop making progress instead of exiting, so a
# single test that has not completed in 15 seconds is terminated and named by
# nextest rather than consuming the rest of a 900-second node allowance.
slow-timeout = { period = "15s", terminate-after = 1, grace-period = "2s" }
global-timeout = "60m"

[profile.ci]
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Cargo runs integration test binaries one after another, and these binaries
# also use process-local mutexes to serialize Hermit executions. Nextest runs
# each test in a separate process, so keep their shared contract explicit.
[test-groups.hermit-serialized]
max-threads = 1

# This source-audit test deliberately runs all six named `record` container
# sites under both injected child-fault classes: 12 separate Hermit processes.
# Three complete validation runs measured it at 25.98-26.30s while passing, so
# 30s covers that observed work without widening any other test's 15s limit.
[[profile.default.overrides]]
filter = "test(/(^|::)every_record_container_site_classifies_a_child_fault_by_name$/)"
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "2s" }

# This cell forces hermit's `--timeout` SIGALRM fallback to fire, so its runtime
# is a SUM OF TWO DELIBERATE CONSTANTS, not a measurement that might drift: the
# smallest expressible bound (1s, the flag takes a NonZeroU64) plus
# RUN_TIMEOUT_UNWIND_GRACE (10s, hermit-cli/src/lib.rs). It measured 11.2s inside
# a 13.46s three-cell run. Against the 15s default that is a 1.36x margin, which
# is how a correct bound becomes an intermittent red under load; 30s restores
# real headroom without widening any other test.
#
# It cannot be made faster without making the grace itself configurable, which
# would mean the cell no longer exercises the shipped constant. See
# docs/TIMEOUT_LADDER.md -- an inner bound that is not comfortably smaller than
# its outer bound is exactly the failure this override avoids.
[[profile.default.overrides]]
filter = "test(/(^|::)run_timeout_fallback_fires_when_the_unwind_does_not_finish$/)"
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "2s" }

# This test deliberately waits for timeout(1)'s 15s deadline before checking
# that the container init disappears. The complete three-test binary measured
# 16.2s while passing; 30s leaves room for its named teardown check without
# widening the two sibling tests.
[[profile.default.overrides]]
filter = "binary(=container_init_deadline) & test(/(^|::)bare_timeout_kills_a_hung_hermit_run$/)"
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "2s" }

[[profile.default.overrides]]
filter = "package(=hermit) & kind(=test)"
test-group = "hermit-serialized"
