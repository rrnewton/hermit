nextest-version = "0.9.100"

[profile.default]
fail-fast = false
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
# This is the per-test-process bound, below the enclosing DAG node's batch
# bound. Hermit failures commonly stop making progress instead of exiting, so a
# single test that has not completed in 10 seconds is terminated and named by
# nextest rather than consuming the rest of a 900-second node allowance.
slow-timeout = { period = "10s", terminate-after = 1, grace-period = "2s" }
global-timeout = "60m"

[profile.ci]
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Cargo runs integration test binaries one after another, and these binaries
# also use process-local mutexes to serialize Hermit executions. Nextest runs
# each test in a separate process, so keep their shared contract explicit.
[test-groups.hermit-serialized]
max-threads = 1

[[profile.default.overrides]]
filter = "package(=hermit) & kind(=test)"
test-group = "hermit-serialized"
