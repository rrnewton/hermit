# Cross-backend parity selection: which parity cells the parity report
# measures. See https://github.com/rrnewton/hermit/issues/3301.
#
# A parity cell compares one manifest test's verify run on a candidate backend
# (dbt, kvm, liteinst or sabre) with the same test's verify run on ptrace, the
# reference. Tests are sorted, and each test's backends are sorted.
#
# This file is deliberately NOT under tests/e2e/manifests: the manifest reader
# parses every YAML file in that directory as a bucket manifest, and the parity
# loader (ci/manifest-plan/src/parity.rs) refuses a selection placed there.
#
# The loader also refuses unknown or retired test ids, ptrace and unknown
# backends, and any cell whose verify mode is not enabled on both ptrace and the
# candidate. A listed cell that is enabled but not selected by full validation
# is accepted; ci/compat-envelope/parity-cells.json marks it "selectable": false
# with the reason, and it stays unmeasured until both verify cells are selected.
#
# After editing this file, regenerate the snapshot with:
#   cargo run -p hermit-manifest-plan --bin generate-parity-cells -- --write
schema: 1
rule: >-
  Every candidate-backend (dbt, kvm, liteinst, sabre) verify cell of a test in
  the backend-parity-c manifest bucket whose ptrace verify cell is selected by
  full validation, provided the candidate's verify cell is enabled. Candidate
  cells that are enabled but not selected by full validation are included and
  marked not selectable in ci/compat-envelope/parity-cells.json.
cells:
  - test: backend-parity-c/aio-refusal
    backends: [kvm, liteinst]
  - test: backend-parity-c/append-pwrite
    backends: [kvm, liteinst]
