schema: 3
bucket: data-handling
test:
- id: data-handling/archive-roundtrip
  description: Create, extract, and verify a normalized tar archive
  lane: portable
  requires:
  - linux
  - x86_64
  - userns
  - ptrace
  occasional: false
  program: tests/e2e/data-handling/archive-roundtrip.sh
  observation:
    status: true
    stdout: true
    stderr: false
    artifacts: []
  modes:
    naked:
      ci: false
      backends_enabled: []
      backends_disabled:
        native: Normalized archive metadata is deterministic by construction
    verify:
      ci: true
      backends_enabled:
      - ptrace
      - kvm
      - dbt
      - sabre
      - liteinst
      - in-guest-trap
      backends_disabled: {}
      hermit_args:
        liteinst:
        - --max-timeslice=disabled
        in-guest-trap:
        - --max-timeslice=disabled
      hermit_args_reason: In-guest LiteInst refuses a preemption timer (parity sweep scratch)
    replay:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: The focused C sentinel owns the blocking replay contract
        dbt: Record/replay is unsupported by DBT
        kvm: Record/replay is unsupported by KVM
        sabre: Record/replay is unsupported by SaBRe
        liteinst: Record/replay is unsupported by LiteInst
        in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
    chaos:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: The workload is single-threaded
        dbt: Chaos scheduling is unsupported by DBT
        kvm: Chaos scheduling is unsupported by KVM
        sabre: Chaos scheduling is unsupported by SaBRe
        liteinst: Chaos scheduling is unsupported by LiteInst
        in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
    custom:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: No edge-case Hermit arguments are required
        dbt: No edge-case Hermit arguments are required
        kvm: No edge-case Hermit arguments are required
        sabre: No edge-case Hermit arguments are required
        liteinst: No edge-case Hermit arguments are required
        in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
