- id: data-handling/zstd-multithread
  description: Multithreaded zstd worker pool reassembles a byte-identical frame under Hermit
  lane: portable
  requires:
  - linux
  - x86_64
  - userns
  - ptrace
  - zstd
  occasional: false
  program: tests/e2e/data-handling/zstd-multithread.sh
  observation:
    status: true
    stdout: true
    stderr: false
    artifacts: []
  modes:
    naked:
      ci: false
      backends_enabled: []
      backends_disabled:
        native: zstd fixes job boundaries by input offset, not by which worker claims a job, so the frame is deterministic by construction natively; this is a mechanism test, not a native-variance test
    verify:
      ci: true
      timeout_seconds:
        ptrace: 118
        kvm: 118
        dbt: 118
        sabre: 118
        liteinst: 118
        in-guest-trap: 118
      cpu_timeout_seconds:
        ptrace: 56
        kvm: 56
        dbt: 56
        sabre: 56
        liteinst: 56
        in-guest-trap: 56
      slow_reason:
        ptrace: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
        kvm: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
        dbt: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
        sabre: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
        liteinst: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
        in-guest-trap: Across 59 retained typed passing rows, nearest-rank p90 was 39.112 wall seconds and 37.109853 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=118 and ceil(1.5x CPU)=56.
      backends_enabled:
      - ptrace
      - kvm
      - dbt
      - sabre
      - liteinst
      - in-guest-trap
      backends_disabled: {}
      hermit_args:
        liteinst:
        - --max-timeslice=disabled
        in-guest-trap:
        - --max-timeslice=disabled
      hermit_args_reason: In-guest LiteInst refuses a preemption timer (parity sweep scratch)
    replay:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: The focused C sentinel owns the blocking replay contract
        dbt: Record/replay is unsupported by DBI
        kvm: Record/replay is unsupported by KVM
        sabre: Record/replay is unsupported by SaBRe
        liteinst: Record/replay is unsupported by LiteInst
        in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
    chaos:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: 'Enabling chaos here is a genuine follow-up: the worker pool is real guest concurrency, but the frame digest must first be shown stable under chaos scheduling before it can gate CI'
        dbt: Chaos scheduling is unsupported by DBI
        kvm: Chaos scheduling is unsupported by KVM
        sabre: Chaos scheduling is unsupported by SaBRe
        liteinst: Chaos scheduling is unsupported by LiteInst
        in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
    custom:
      ci: false
      backends_enabled: []
      backends_disabled:
        ptrace: No edge-case Hermit arguments are required
        dbt: No edge-case Hermit arguments are required
        kvm: No edge-case Hermit arguments are required
        sabre: No edge-case Hermit arguments are required
        liteinst: No edge-case Hermit arguments are required
        in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
