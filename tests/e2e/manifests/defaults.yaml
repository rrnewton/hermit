schema: 3
timeout_seconds: 15
nextest:
  - filter: test(/(^|::)every_record_container_site_classifies_a_child_fault_by_name$/)
    timeout_seconds: 45
    slow_reason: Across 85 attempts of this source audit's 12 separate Hermit processes, results were 64 passed and 21 timed out at the old 30s threshold; the longest passing attempt was 29.935s, so 45s is 1.50x that passing maximum.
  - filter: test(/(^|::)run_timeout_fallback_fires_when_the_unwind_does_not_finish$/)
    timeout_seconds: 30
    slow_reason: This test forces the smallest expressible 1-second timeout plus the 10-second RUN_TIMEOUT_UNWIND_GRACE, measured 11.2 seconds inside a 13.46-second three-test run; 30 seconds preserves headroom without changing the shipped grace.
  - filter: binary(=container_init_deadline)
    timeout_seconds: 30
    slow_reason: This binary deliberately exercises a 15-second timeout and cleanup paths with a 20-second teardown budget; once registered, a sibling test hit the 15-second default at 15.002 seconds, so all three tests receive the owner's 30-second exception.
