schema = 2
bucket = "performance"

[[test]]
id = "performance/mutex-contention"
description = "Long-running mutex contention with forced scheduler handoffs"
lane = "privileged"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 300
occasional = false
program = "tests/e2e/performance/mutex-contention.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }
build = { cflags = ["-pthread"] }

[test.modes.verify]
ci = false
backends_enabled = ["ptrace", "dbi", "kvm", "sabre"]
backends_disabled = { liteinst = "LiteInst rejected the threaded profile during initial strict verification" }
[test.modes.naked]
ci = false
backends_enabled = []
backends_disabled = { native = "Native timing is not a deterministic performance baseline" }
[test.modes.replay]
ci = false
backends_enabled = []
backends_disabled = { ptrace = "Strict verification owns this performance cell", dbi = "Record/replay is unsupported by DBI", kvm = "Record/replay is unsupported by KVM", sabre = "Record/replay is unsupported by SaBRe", liteinst = "Record/replay is unsupported by LiteInst" }
[test.modes.chaos]
ci = false
backends_enabled = []
backends_disabled = { ptrace = "Steady-state verification uses the default deterministic scheduler", dbi = "Chaos scheduling is unsupported by DBI", kvm = "Chaos scheduling is unsupported by KVM", sabre = "Chaos scheduling is unsupported by SaBRe", liteinst = "Chaos scheduling is unsupported by LiteInst" }
[test.modes.custom]
ci = false
backends_enabled = []
backends_disabled = { ptrace = "No custom edge-case arguments are required", dbi = "No custom edge-case arguments are required", kvm = "No custom edge-case arguments are required", sabre = "No custom edge-case arguments are required", liteinst = "No custom edge-case arguments are required" }

