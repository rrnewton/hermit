schema = 2
bucket = "performance"

[[test]]
id = "performance/mutex-contention"
description = "Long-running mutex contention with forced scheduler handoffs"
lane = "privileged"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 300
occasional = false
program = "tests/e2e/performance/mutex-contention.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }
build = { cflags = ["-pthread"] }

[test.modes.verify]
ci = false
backends_enabled = ["ptrace"]
backends_disabled = { dbi = "Not freshly qualified at the focused current-main recovery head", kvm = "Not freshly qualified at the focused current-main recovery head", sabre = "Not freshly qualified at the focused current-main recovery head", liteinst = "Not freshly qualified at the focused current-main recovery head" }
[test.modes.naked]
ci = false
backends_enabled = []
backends_disabled = { native = "Native timing is not a deterministic performance baseline" }
[test.modes.replay]
ci = false
backends_enabled = []
backends_disabled = { ptrace = "Strict verification owns this performance cell", dbi = "Record/replay is unsupported by DBI", kvm = "Record/replay is unsupported by KVM", sabre = "Record/replay is unsupported by SaBRe", liteinst = "Record/replay is unsupported by LiteInst" }
[test.modes.chaos]
ci = false
