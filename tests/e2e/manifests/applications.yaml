      - x86_64
      - userns
      - ptrace
      - cc
      - ar
    timeout_seconds: 120
    occasional: false
    program: tests/e2e/applications/c-toolchain-workflow.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The fixed sources, compiler flags, and input make the toolchain transaction deterministic by construction
      verify:
        ci: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Establish the shared C toolchain transaction on the ptrace reference path before backend ratchets
          kvm: KVM requires the privileged runner and must ratchet after the ptrace reference path
          sabre: SaBRe multi-exec toolchain qualification must ratchet after the ptrace reference path
          liteinst: LiteInst multi-exec toolchain qualification must ratchet after the ptrace reference path
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns this toolchain transaction's blocking determinism contract
          dbt: Record/replay is unsupported by DBI
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The build graph is intentionally serial
          dbt: Chaos scheduling is unsupported by DBI
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
