  - id: applications/kvm-shell-environment
    description: KVM executes a shell workload with a deterministic environment
    lane: privileged
    requires:
      - linux
      - x86_64
      - kvm
    timeout_seconds: 60
    occasional: false
    program: tests/e2e/applications/kvm-shell-environment.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This is a privileged KVM backend integration test
      verify:
        ci: false
        backends_enabled:
          - kvm
        backends_disabled:
          ptrace: This test specifically asserts the KVM execution path
          dbt: This test specifically asserts the KVM execution path
          sabre: This test specifically asserts the KVM execution path
          liteinst: This test specifically asserts the KVM execution path
        ci_disabled_reason: 'Measured FAIL 3/3 under kvm at hermit 146756f096, binary sha256 af401d8ff30e5803, re-confirmed at 48a648c8d3706b7f. The first run errors before any comparison runs, so the cell has zero qualifying trials and has never produced a verdict. The guest asserts LC_ALL=C and TZ=UTC under set -u, but scripts/manifest-to-commands.rs runs every verify cell with --base-env=minimal, which supplies only PATH, HOSTNAME and HOME. This is backend-independent and reproduces identically under ptrace. What the cell is meant to assert is UNRESOLVED. Either a deterministic environment, meaning PATH/HOSTNAME/HOME, which --base-env=minimal already guarantees, or LC_ALL and TZ specifically, which would require a manifest-declared environment field that does not exist today. Removal condition. The owner settles which of those two the contract means; that is a decision, not a code change, and the test assertions must not be rewritten to close it.'
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: This is a KVM integration test
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The workload is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
