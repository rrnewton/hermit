schema: 2
bucket: applications
test:
  - id: applications/timed-progress-bar
    description: A time-driven Python application completes identically under verification
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - python3
    timeout_seconds: 120
    occasional: false
    direct:
      - ./examples/timed-progress-bar.py
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Elapsed time drives progress but final output is intentionally stable
      verify:
        ci: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: DBT application coverage is owned by backend parity
          kvm: KVM requires the privileged runner
          sabre: SaBRe does not yet determinize busy-wait polling on virtual wall-clock advancement; main validation has observed verify failure under load
          liteinst: LiteInst application coverage is owned by backend compatibility
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Focused time and entropy sentinels own the blocking replay contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The application is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
