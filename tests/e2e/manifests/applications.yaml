  - id: applications/git-repository-workflow
    description: Create two Git commits, verify the repository, and archive the resulting tree
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - git
    timeout_seconds: 120
    occasional: false
    program: tests/e2e/applications/git-repository-workflow.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Fixed content, identities, timestamps, and configuration make the repository transaction deterministic by construction
      verify:
        ci: false
        ci_disabled_reason: "MEASURED 9 PASS / 1 FAIL of 10 on main. NOT the cwd defect, which is FIXED and whose fix stays: newfstatat on /home/newton is now 0 across ten runs, down from 24. The residual is a DIFFERENT and still-live divergence -- detcore::io_buffers [iobuf] getdents64 in +112, same syscall, same address, same byte count in both verification runs, only the CONTENT differing, i.e. a directory listing that changes between the pair. Exposed by #2384 turning IO-buffer hashing on, and one of three cells failing that same way (the other two are language-runtimes/python-dict-hash-iteration and python-io-subprocess-time, both on netlink recvmsg +1468). Held out of the required population because a 1-in-10 failure should not run in CI while every red truncates the lane; re-enable when the getdents64 buffer-content divergence is determinized, not before."
        # Bash inspects inherited PWD before this script can cd, and Git
        # discovers repositories through cwd ancestors, so an ancestor
        # directory's st_size changing between the verify pair produced
        # unequal strict logs. Start in the fresh private guest /tmp, which
        # hermit resolves AFTER installing guest mounts. THIS FIX WORKS and is
        # deliberately retained -- see ci_disabled_reason for the separate,
        # still-open defect that keeps the cell out of CI.
        workdir: /tmp
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Establish the shared Git transaction on the ptrace reference path before backend ratchets
          kvm: KVM requires the privileged runner and must ratchet after the ptrace reference path
          sabre: SaBRe multi-exec Git qualification must ratchet after the ptrace reference path
          liteinst: LiteInst multi-exec Git qualification must ratchet after the ptrace reference path
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns this repository transaction's blocking determinism contract
          dbt: Record/replay is unsupported by DBI
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The repository transaction is intentionally serial
          dbt: Chaos scheduling is unsupported by DBI
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns the Git transaction; no custom Hermit arguments are required
          dbt: The Git transaction is not qualified on DBI
          kvm: The Git transaction is not qualified on KVM
          sabre: The Git transaction is not qualified on SaBRe
          liteinst: The Git transaction is not qualified on LiteInst
