# Shell source coverage for CI Overhaul v2. Executable protocol wrappers are
# manifest tests; helpers, drivers, aliases, and legacy non-protocol guests have
# explicit dispositions so coverage audits never silently drop a source path.

schema = 2
bucket = "shell-programs"

[[test]]
id = "shell-programs/e2e-applications-kvm-python-examples"
description = "The user-facing Python examples run identically with the system interpreter under KVM"
lane = "privileged"
requires = ["linux", "x86_64", "kvm", "python3"]
timeout_seconds = 120
occasional = false
program = "tests/e2e/applications/kvm-python-examples.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["kvm"]
[test.modes.verify.backends_disabled]
ptrace = "This wrapper is the focused KVM integration case; portable ptrace coverage lives in sibling entries"
dbi = "This wrapper is the focused KVM integration case; qualify DBI separately"
sabre = "This wrapper is the focused KVM integration case; qualify SaBRe separately"
liteinst = "This wrapper is the focused KVM integration case; qualify LiteInst separately"

[test.disabled_modes]
naked = "The portable Python random case already provides the native nondeterminism control"
replay = "Record/replay is a ptrace-only mode"
chaos = "Both examples are single-threaded"

[[test]]
id = "shell-programs/e2e-applications-kvm-shell-environment"
description = "KVM executes a shell workload with a deterministic environment"
lane = "privileged"
requires = ["linux", "x86_64", "kvm"]
timeout_seconds = 60
occasional = false
program = "tests/e2e/applications/kvm-shell-environment.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["kvm"]
[test.modes.verify.backends_disabled]
ptrace = "This wrapper is the focused KVM integration case; portable ptrace coverage lives in sibling entries"
dbi = "This wrapper is the focused KVM integration case; qualify DBI separately"
sabre = "This wrapper is the focused KVM integration case; qualify SaBRe separately"
liteinst = "This wrapper is the focused KVM integration case; qualify LiteInst separately"

[test.disabled_modes]
naked = "This is a privileged backend integration test"
replay = "KVM has no record/replay runtime"
chaos = "KVM does not provide Detcore schedule exploration"

[[test]]
id = "shell-programs/e2e-applications-timed-progress-bar"
description = "A time-driven Python application completes identically under verification"
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace", "python3"]
timeout_seconds = 120
occasional = false
program = "tests/e2e/applications/timed-progress-bar.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Initial shell migration preserves the established ptrace baseline; qualify DBI separately"
kvm = "Initial shell migration preserves the established ptrace baseline; qualify KVM separately"
sabre = "Initial shell migration preserves the established ptrace baseline; qualify SaBRe separately"
liteinst = "LiteInst interception remains incomplete for broad shell workloads (#1047)"

[test.disabled_modes]
naked = "Elapsed time drives progress but the final application output is intentionally stable"
replay = "The shorter time and entropy cases provide the blocking replay sentinels"
chaos = "The application is single-threaded"

