[[test]]
id = "shell-programs/e2e-determinism-stress-process-chains"
description = "A 13-process fork tree and five-stage C pipe chain repeat under strict verification"
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 120
occasional = false
program = "tests/e2e/determinism-stress/process-chains.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Initial shell migration preserves the established ptrace baseline; qualify DBI separately"
kvm = "Initial shell migration preserves the established ptrace baseline; qualify KVM separately"
sabre = "Initial shell migration preserves the established ptrace baseline; qualify SaBRe separately"
liteinst = "LiteInst interception remains incomplete for broad shell workloads (#1047)"

[test.disabled_modes]
naked = "Both programs self-check deterministic invariants rather than requiring native output variation"
replay = "The focused C replay sentinel owns the blocking record/replay contract"
chaos = "The order-violation test provides the seeded schedule-diversity oracle"

[[test]]
id = "shell-programs/e2e-determinism-stress-thread-output"
description = "Concurrent shell writers produce repeatable output under strict verification"
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace"]
timeout_seconds = 90
occasional = false
program = "tests/e2e/determinism-stress/thread-output.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Initial shell migration preserves the established ptrace baseline; qualify DBI separately"
kvm = "Initial shell migration preserves the established ptrace baseline; qualify KVM separately"
sabre = "Initial shell migration preserves the established ptrace baseline; qualify SaBRe separately"
liteinst = "LiteInst interception remains incomplete for broad shell workloads (#1047)"

[test.disabled_modes]
naked = "Native ordering can vary but is not guaranteed to diverge in a bounded run"
replay = "Strict verification already covers this example in the required lane"
chaos = "The focused order-violation test provides a stronger seeded oracle"

[[test]]
id = "shell-programs/e2e-language-runtimes-python-random"
