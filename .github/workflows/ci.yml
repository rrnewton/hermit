name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      qemu_l2:
        description: Run the optional heavyweight QEMU strict-L2 boot gate
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings

jobs:
  regular:
    name: Regular tests (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Enforce detcore backend-abstraction commandment
      run: ./scripts/check-detcore-backend-abstraction.sh
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bsdextrautils bzip2 cmake curl default-jdk-headless file g++ gcc gawk git gzip jq libunwind-dev liblzma-dev lua5.4 make nginx nodejs openssl perl python3-full redis-server redis-tools sqlite3 util-linux xz-utils zlib1g-dev zstd
    - name: Enable unprivileged user and mount namespaces
      run: |
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: Install cargo-nextest
      run: cargo install cargo-nextest --locked --version "$NEXTEST_VERSION"
    - name: Rust components
      run: rustup component add clippy rustfmt
    - name: Portable test lane (no PMU or CPUID interception)
      run: ./validate.sh --hosted-only --no-label-pr
    - name: Upload nextest JUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nextest-junit-${{ github.job }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: warn
        retention-days: 14

  # AUTONOMOUS-BOT-IMPLEMENTED
  # TODO-HUMAN-REVIEW(#553)
  qemu-l2:
    name: QEMU strict L2 boot (optional heavyweight)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.qemu_l2
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Dependencies
      run: |
        # Refresh the (partial) self-hosted package index first, install the hard
        # link deps strictly, then the rest best-effort so a missing package does
        # not fail the step before the preflight can report a clear diagnosis.
        if command -v dnf >/dev/null; then
          sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
          sudo dnf install -y gcc-c++ libunwind-devel xz-devel
          for pkg in cmake zlib-devel cpio gzip qemu-system-x86-core; do
            sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
          done
        elif command -v apt-get >/dev/null; then
          sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
          sudo apt-get install -y g++ libunwind-dev liblzma-dev
          for pkg in cmake zlib1g-dev cpio gzip qemu-system-x86; do
            sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
          done
        else
          echo "::error::Unsupported package manager; QEMU L2 dependencies are unavailable"
          exit 1
        fi
    - name: QEMU and namespace preflight
      run: |
        command -v qemu-system-x86_64
        test -r /boot/vmlinuz
        unshare --user --map-root-user --pid --fork --uts --net --mount \
          sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: Validate QEMU strict L2 boot
      env:
        KERNEL_IMAGE: /boot/vmlinuz
      run: ./validate.sh --qemu-l2-only --no-label-pr

  hardware:
    name: PMU and CPUID tests (self-hosted)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.user.login == 'rrnewton'
          )
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    timeout-minutes: 240
    env:
      DETCORE_TEST_RUST_LOG: "off"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Dependencies
      run: |
        # Install compiler/linker dependencies strictly. Runtime and debugger
        # packages are best-effort here because this runner has a partial package
        # mirror; the following preflight reports any missing capability clearly.
        if command -v dnf >/dev/null; then
          sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
          sudo dnf install -y gcc-c++ libunwind-devel xz-devel
          for pkg in cmake zlib-devel redis sqlite ruby nodejs java-latest-openjdk-devel ocaml python3-test gdb lldb; do
            sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
          done
        elif command -v apt-get >/dev/null; then
          sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
          sudo apt-get install -y g++ libunwind-dev liblzma-dev
          for pkg in cmake zlib1g-dev redis-server redis-tools sqlite3 ruby nodejs default-jdk-headless ocaml-nox libpython3.12-testsuite gdb lldb; do
            sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
          done
        else
          echo "::error::Unsupported package manager"
          exit 1
        fi
    - name: Require hardware and runtime capabilities
      run: |
        test -r /proc/sys/kernel/perf_event_paranoid
        test -r /dev/kvm -a -w /dev/kvm
        command -v go ruby node javac java ocamlopt python3 redis-server redis-cli sqlite3 gdb lldb
        python3 -c 'import test.support'
        unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: PMU and CPUID test lane
      run: ./validate.sh --hardware-only --no-label-pr
