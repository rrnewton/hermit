name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      qemu_l2:
        description: Run the optional heavyweight QEMU strict-L2 boot gate
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings

jobs:
  regular:
    name: Regular tests (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Enforce detcore backend-abstraction commandment
      run: ./scripts/check-detcore-backend-abstraction.sh
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bsdextrautils bzip2 cmake curl default-jdk-headless file g++ gcc gawk git gzip jq libpython3.12-testsuite libunwind-dev liblzma-dev lua5.4 make nginx nodejs openssl perl python3-full redis-server redis-tools sqlite3 util-linux xz-utils zlib1g-dev zstd
    - name: Enable unprivileged user and mount namespaces
      run: |
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: Install cargo-nextest
      run: cargo install cargo-nextest --locked --version "$NEXTEST_VERSION"
    - name: Rust components
      run: rustup component add clippy rustfmt
    - name: Portable test lane (no PMU or CPUID interception)
      run: ./validate.sh --hosted-only --no-label-pr
    - name: Upload nextest JUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nextest-junit-${{ github.job }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: warn
        retention-days: 14

  # AUTONOMOUS-BOT-IMPLEMENTED
  # TODO-HUMAN-REVIEW(#553)
  qemu-l2:
    name: QEMU strict L2 boot (optional heavyweight)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.qemu_l2
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Dependencies
      run: |
        if command -v dnf >/dev/null; then
          sudo dnf install -y cmake gcc-c++ libunwind-devel xz-devel zlib-devel cpio gzip qemu-system-x86-core
        elif command -v apt-get >/dev/null; then
          sudo apt-get install -y cmake g++ libunwind-dev liblzma-dev zlib1g-dev cpio gzip qemu-system-x86
        else
          echo "::error::Unsupported package manager; QEMU L2 dependencies are unavailable"
          exit 1
        fi
    - name: QEMU and namespace preflight
      run: |
        command -v qemu-system-x86_64
        test -r /boot/vmlinuz
        unshare --user --map-root-user --pid --fork --uts --net --mount \
          sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: Validate QEMU strict L2 boot
      env:
        KERNEL_IMAGE: /boot/vmlinuz
      run: ./validate.sh --qemu-l2-only --no-label-pr

  hardware:
    name: PMU and CPUID tests (self-hosted)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'rrnewton'
        )
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    timeout-minutes: 240
    env:
      DETCORE_TEST_RUST_LOG: "off"

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Dependencies
      run: |
        if command -v dnf >/dev/null; then
          sudo dnf install -y cmake gcc-c++ libunwind-devel xz-devel zlib-devel
        elif command -v apt-get >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y cmake g++ libunwind-dev liblzma-dev zlib1g-dev
        else
          echo "::error::Unsupported package manager"
          exit 1
        fi
    - name: Require PMU and mount namespace support
      run: |
        test -r /proc/sys/kernel/perf_event_paranoid
        test -r /dev/kvm -a -w /dev/kvm
        command -v go ruby node javac java ocamlopt python3 redis-server redis-cli sqlite3 gdb lldb
        unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
    - name: PMU and CPUID test lane
      run: ./validate.sh --hardware-only --no-label-pr
