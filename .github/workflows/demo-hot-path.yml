name: P0 Demo Gate (Hermit hot paths)

# The unified demos live in rrnewton/dev-hermit, but the parent repository has
# no self-hosted runner. Run the suite from Hermit's existing trusted PMU lane:
# check out the current parent demo harness, then overlay the exact Hermit
# commit that triggered this workflow. Keep this paths list synchronized with
# the hot-path test in merge-gate.yml.
#
# tests/e2e/** and tests/backend-parity/** are deliberately subtracted (via the
# trailing "!" negations under each "tests/**"): the demo job runs
# `scripts/super-validate.sh --demos-only`, which builds the hermit binary and
# executes ONLY the parent demo suite (demos 1-8) — it never runs the hermit e2e
# corpus or the backend-parity fixtures. So a PR that only touches those trees
# provably cannot affect a demo verdict; triggering a serial PMU demo run for it
# just clogs the lane and (when cancelled) wedges the PR. Removing them here
# means the workflow does not even fire for such PRs, mirroring the merge-gate
# classifier's `grep -vE '^tests/(e2e|backend-parity)/'` subtraction so the
# trigger and the requirement stay consistent. Hot-path gating is UNCHANGED for
# detcore*/**, hermit-cli/**, tests/c/** (guest programs), and everything else.
on:
  # Exercise the cache-bypassing calibration path deliberately instead of
  # waiting for an accidental cache miss to discover that it is broken.
  schedule:
    - cron: "43 09 * * 0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-hot-path.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "common/**"
      - "detcore*/**"
      - "examples/**"
      - "flaky-tests/**"
      - "hermit-cli/**"
      - "hermit-install/**"
      - "hermit-resources/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "!tests/e2e/**"
      - "!tests/backend-parity/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-hot-path.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "common/**"
      - "detcore*/**"
      - "examples/**"
      - "flaky-tests/**"
      - "hermit-cli/**"
      - "hermit-install/**"
      - "hermit-resources/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "!tests/e2e/**"
      - "!tests/backend-parity/**"
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Exact Hermit SHA to demo-gate on demand. Use this to attribute a
          post-land main red to a specific landed commit (git-bisect style)
          now that main runs collapse to the newest tip. Empty = the dispatched
          ref's tip.
        required: false
        type: string
      force_cold_calibration:
        description: >-
          Ignore a restored Demo 8 crash-seed hint and exercise the full cold
          calibration path. Scheduled runs always enable this.
        required: false
        default: false
        type: boolean

concurrency:
  # Group each ref's runs, but NEVER cancel a RUNNING main demo (owner directive
  # 2026-08-03, Directive B). cancel-in-progress is event-aware:
  #   * pull_request -> TRUE: a new push to a PR supersedes the older head, so PR
  #     demo runs never STACK on the scarce serial PMU lane (the head that lands
  #     re-runs). Grouped per PR number. This is the pre-land gate merge-gate.yml
  #     requires at the PR head SHA.
  #   * push(main) -> FALSE: all main pushes share ONE group (github.ref), so a
  #     burst of N landings is queue-depth-1 -- GitHub lets the RUNNING demo
  #     finish and supersedes only the older PENDING run. The old
  #     cancel-in-progress:true KILLED the running main demo on every landing,
  #     producing a pile of CANCELLED runs with no data; this stops that and
  #     yields a sparse dataset of COMPLETE post-land health runs.
  #   * workflow_dispatch -> FALSE, grouped per github.run_id (unique): manual
  #     on-demand runs never collide, preserving per-SHA post-land culprit
  #     attribution (bisect a post-land main red by dispatching several `sha`
  #     inputs; they queue serially, or `git bisect` with
  #     scripts/super-validate.sh --demos-only).
  #   * schedule -> FALSE, grouped per github.run_id (unique): the weekly
  #     forced-cold calibration is never mistaken for or cancelled by a
  #     change-triggered cache-replay run.
  # cancel-in-progress never touches COMPLETED runs, so a submodule bump or
  # queue-health check citing the newest completed main demo run is unaffected.
  group: hermit-demo-gate-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEMO08_REQUIRE_ASSETS: "1"
  DETCORE_TEST_RUST_LOG: "off"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings
  SUITE_DIR: ${{ github.workspace }}/dev-hermit-demo-suite
  TARGET_SHA: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  reject-untrusted-fork:
    name: P0 demo gate requires a trusted branch
    if: >-
      github.repository == 'rrnewton/hermit' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error title=P0 demo gate not executed::Self-hosted demos do not execute fork-authored code. Move this change to a trusted rrnewton/hermit branch before landing."
          exit 1

  demos:
    name: P0 demo gate (demos 1-8)
    if: >-
      github.repository == 'rrnewton/hermit' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    # No pmu-serial: demos are not counter-scarce and PMU skid is an
    # instruction-space hardware property independent of concurrency, so there
    # is no determinism reason to pin every demo to one serialized box. If a
    # demo turns out to be load-sensitive once it can co-run, that is a real
    # determinism finding to file, not a reason to restore serialization. The
    # concurrency block below still collapses each ref to its newest run so
    # bursts of landings do not stack.
    runs-on: [Linux, X64, hermit, pmu]
    timeout-minutes: 360
    steps:
      - name: Remove stale checkout locks
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            timeout --foreground --kill-after=5s 30s \
              find "$GITHUB_WORKSPACE/.git" -type f -name "*.lock" -print -delete
          fi

      - name: Check out the unified demo suite
        uses: actions/checkout@v4
        with:
          repository: rrnewton/dev-hermit
          ref: main
          path: dev-hermit-demo-suite
          submodules: false

      - name: Overlay the exact Hermit commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: dev-hermit-demo-suite/hermit
          submodules: false

      - name: Verify exact culprit attribution
        run: |
          set -euo pipefail
          actual="$(git -C "$SUITE_DIR/hermit" rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          # The parent harness records a stable Hermit gitlink. Stage the
          # overlaid PR SHA so its recursive submodule init cannot restore the
          # older parent pin before the demos run.
          git -C "$SUITE_DIR" add hermit
          recorded="$(git -C "$SUITE_DIR" rev-parse :hermit)"
          test "$recorded" = "$TARGET_SHA"
          echo "Demo suite Hermit SHA: $actual"
          echo "Demo suite staged Hermit gitlink: $recorded"
          echo "Demo harness SHA: $(git -C "$SUITE_DIR" rev-parse HEAD)"

      - name: Ensure the repository Rust toolchain
        working-directory: dev-hermit-demo-suite/hermit
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            rustup_init="$RUNNER_TEMP/rustup-init.sh"
            download=(curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$rustup_init")
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy "${download[@]}"
            else
              "${download[@]}"
            fi
            install_rustup=(sh "$rustup_init" -y --profile minimal --default-toolchain none)
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy "${install_rustup[@]}"
            else
              "${install_rustup[@]}"
            fi
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          install_toolchain=(rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt)
          if command -v with-proxy >/dev/null 2>&1; then
            with-proxy "${install_toolchain[@]}"
          else
            "${install_toolchain[@]}"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev-hermit-demo-suite/hermit -> target
          shared-key: hermit-hot-path-demo-gate
          cache-on-failure: true
          # The self-hosted runner's rustup/cargo executables are toolchain
          # prerequisites, not disposable build cache entries.
          cache-bin: false

      - name: Install demo dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y \
              autoconf automake binutils bpftool busybox cpio e2fsprogs e2fsprogs-devel \
              clang cmake curl elfutils-libelf-devel file gcc gcc-c++ git gdb gzip \
              libblkid-devel libunwind-devel libuuid-devel libzstd-devel \
              lua lzo-devel make patch pkgconf-pkg-config python3 python3-devel \
              python3-pip qemu-img qemu-kvm-core ruby tcl-devel xz-devel zlib-devel
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing metadata"
            sudo apt-get install -y \
              autoconf automake binutils build-essential busybox-static cpio linux-tools-generic \
              clang cmake curl e2fsprogs file gdb git gzip libblkid-dev libdw-dev libelf-dev \
              libext2fs-dev liblzo2-dev liblzma-dev libunwind-dev libzstd-dev \
              lua5.4 patch pkg-config python3 python3-dev python3-pip \
              qemu-system-x86 qemu-utils ruby tcl-dev uuid-dev zlib1g-dev
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi

          # Ubuntu's /usr/bin/bpftool wrapper insists that its packaged kernel
          # version match uname. This runner uses an Ubuntu userspace on a
          # Fedora host kernel, but the real generic bpftool is kernel-agnostic
          # for BTF decoding. Install it into a PATH dir promoted ahead of the
          # wrapper (via $GITHUB_PATH) rather than a hardcoded system prefix, so
          # this works on any runner. Override the destination with BPFTOOL_BIN_DIR.
          if ! bpftool version >/dev/null 2>&1; then
            # linux-tools ships bpftool under a hyphen/version-suffixed dir
            # (e.g. /usr/lib/linux-tools-6.8.0-136/), not a bare
            # /usr/lib/linux-tools, so search /usr/lib for any linux-tools* path.
            bpftool_bin=$(find /usr/lib -path '*linux-tools*' -name bpftool \
              -type f -perm -111 -print 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$bpftool_bin" ] || [ ! -x "$bpftool_bin" ]; then
              echo "::error::no usable bpftool found under /usr/lib/*linux-tools*; install linux-tools-generic (Debian/Ubuntu) or the equivalent, or set BPFTOOL_BIN_DIR to a dir containing a working bpftool" >&2
              exit 1
            fi
            bpftool_dir="${BPFTOOL_BIN_DIR:-$HOME/.local/bin}"
            mkdir -p "$bpftool_dir"
            install -m755 "$bpftool_bin" "$bpftool_dir/bpftool"
            echo "$bpftool_dir" >>"$GITHUB_PATH"
          fi

          if ! command -v drgn >/dev/null 2>&1; then
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy python3 -m pip install --user drgn || \
                with-proxy python3 -m pip install --user --break-system-packages drgn
            else
              python3 -m pip install --user drgn || \
                python3 -m pip install --user --break-system-packages drgn
            fi
            echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          fi

      - name: Require the demo host capabilities
        working-directory: dev-hermit-demo-suite
        run: |
          set -euo pipefail
          make doctor-qemu
          command -v bpftool drgn gcc readelf mkfs.ext4 patch
          bpftool version
          test -r /proc/sys/kernel/perf_event_paranoid
          unshare --user --map-root-user --pid --fork true

      - name: Restore pinned heavy-demo assets
        id: demo08-cache
        uses: actions/cache@v4
        with:
          path: |
            dev-hermit-demo-suite/ignored/demo08-btrfs
            dev-hermit-demo-suite/ignored/demo08-build/btrfs-progs-v7.1
          key: hermit-demo-assets-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Select and label the Demo 8 calibration path
        shell: bash
        env:
          CACHE_HIT: ${{ steps.demo08-cache.outputs.cache-hit }}
          FORCE_COLD: ${{ github.event_name == 'schedule' || inputs.force_cold_calibration }}
        run: |
          set -euo pipefail
          seed_file="$SUITE_DIR/ignored/demo08-btrfs/.crash-seed"
          seed_hint_present=false
          if [[ -r "$seed_file" ]]; then
            seed_hint_present=true
          fi

          if [[ "$FORCE_COLD" == true ]]; then
            # The restored fixture/build cache remains warm; only its seed
            # selection hint is removed in this ephemeral job. This makes the
            # calibration consumer execute without mutating the remote cache.
            rm -f -- "$seed_file"
            selected_path=forced-cold-calibration
            requested_mode=force-cold
          elif [[ "$CACHE_HIT" == true && "$seed_hint_present" == true ]]; then
            selected_path=cache-replay
            requested_mode=auto
          else
            selected_path=cold-calibration-on-cache-miss
            requested_mode=auto
          fi

          echo "DEMO08_SELECTED_PATH=$selected_path" >>"$GITHUB_ENV"
          echo "DEMO08_REQUESTED_MODE=$requested_mode" >>"$GITHUB_ENV"
          echo "::notice title=Demo 8 calibration path::$selected_path; cache_hit=${CACHE_HIT:-false}; seed_hint_present=$seed_hint_present"
          {
            echo "## Demo 8 calibration path"
            echo
            echo "- selected path: $selected_path"
            echo "- cache restore hit: ${CACHE_HIT:-false}"
            echo "- restored seed hint present: $seed_hint_present"
            echo "- cadence: forced cold every Sunday at 09:43 UTC"
            echo
            echo "A cache-replay green is not evidence that cold calibration works."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run demos 1-8 at the exact Hermit SHA
        id: demo-sweep
        working-directory: dev-hermit-demo-suite
        run: |
          set -euo pipefail
          command=(scripts/super-validate.sh --demos-only)
          if command -v with-proxy >/dev/null 2>&1; then
            command=(with-proxy "${command[@]}")
          fi
          timeout --foreground --kill-after=60s 21000s \
            "${command[@]}" 2>&1 | tee demo-sweep-validation.log

      - name: Record separate cache-replay and cold-calibration denominators
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.demo08-cache.outputs.cache-hit }}
          DEMO_SWEEP_OUTCOME: ${{ steps.demo-sweep.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_COLD: ${{ github.event_name == 'schedule' || inputs.force_cold_calibration }}
        run: |
          set -euo pipefail
          report="$SUITE_DIR/ignored/demo08-run/calibration.tsv"
          summary="$SUITE_DIR/demo08-calibration-path.tsv"
          cache_attempted=unmeasured
          cache_engaged=unmeasured
          cache_uaf=unmeasured
          cold_attempted=unmeasured
          cold_engaged=unmeasured
          cold_uaf=unmeasured
          evidence=legacy-no-report
          actual_path_source=no-evidence

          if [[ -r "$report" ]]; then
            cache_attempted="$(awk -F '\t' 'NR > 1 && $2 == "cached" {n++} END {print n + 0}' "$report")"
            cache_engaged="$(awk -F '\t' 'NR > 1 && $2 == "cached" && $3 == "reached" {n++} END {print n + 0}' "$report")"
            cache_uaf="$(awk -F '\t' 'NR > 1 && $2 == "cached" && $4 == "hit" {n++} END {print n + 0}' "$report")"
            cold_attempted="$(awk -F '\t' 'NR > 1 && $2 == "cold" {n++} END {print n + 0}' "$report")"
            cold_engaged="$(awk -F '\t' 'NR > 1 && $2 == "cold" && $3 == "reached" {n++} END {print n + 0}' "$report")"
            cold_uaf="$(awk -F '\t' 'NR > 1 && $2 == "cold" && $4 == "hit" {n++} END {print n + 0}' "$report")"
            evidence=counted
            if (( cache_attempted > 0 && cold_attempted > 0 )); then
              actual_path_source=cache-replay+cold-calibration
            elif (( cache_attempted > 0 )); then
              actual_path_source=cache-replay
            elif (( cold_attempted > 0 )); then
              actual_path_source=cold-calibration
            else
              actual_path_source=no-attempts
            fi
          elif [[ -r "$SUITE_DIR/demo-sweep-validation.log" ]]; then
            # Legacy parent harnesses have no counted TSV. Classify their path
            # visibly, but keep every denominator unmeasured so the label is
            # never promoted into evidence that the path worked.
            if grep -q 'Demo 8 crash seed ready (cached seed' "$SUITE_DIR/demo-sweep-validation.log"; then
              actual_path_source=cache-replay-legacy-unmeasured
            elif grep -q 'Calibrating a deterministic crashing seed' "$SUITE_DIR/demo-sweep-validation.log"; then
              actual_path_source=cold-calibration-legacy-unmeasured
            fi
          fi

          parent_sha="$(git -C "$SUITE_DIR" rev-parse HEAD)"
          printf 'event\trequested_mode\tselected_path\tcache_restore_hit\tactual_path_source\tdemo_sweep_outcome\tcache_attempted\tcache_engaged\tcache_uaf\tcold_attempted\tcold_engaged\tcold_uaf\tevidence\tparent_sha\thermit_sha\n' >"$summary"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$EVENT_NAME" "${DEMO08_REQUESTED_MODE:-unknown}" \
            "${DEMO08_SELECTED_PATH:-unknown}" \
            "${CACHE_HIT:-false}" "$actual_path_source" \
            "${DEMO_SWEEP_OUTCOME:-unknown}" "$cache_attempted" \
            "$cache_engaged" "$cache_uaf" "$cold_attempted" "$cold_engaged" \
            "$cold_uaf" "$evidence" "$parent_sha" "$TARGET_SHA" >>"$summary"

          {
            echo
            echo "### Demo 8 counted evidence"
            echo
            echo "- cache replay: attempted=$cache_attempted engaged=$cache_engaged uaf=$cache_uaf"
            echo "- cold calibration: attempted=$cold_attempted engaged=$cold_engaged uaf=$cold_uaf"
            echo "- actual path source: $actual_path_source"
            echo "- demo sweep outcome: ${DEMO_SWEEP_OUTCOME:-unknown}"
            echo "- evidence: $evidence"
          } >>"$GITHUB_STEP_SUMMARY"

          # A deliberately forced cold run cannot be green on a cache replay,
          # a missing report, zero selected cold seeds, or zero engagement.
          if [[ "$FORCE_COLD" == true ]]; then
            if [[ "$evidence" != counted ]]; then
              echo "::error title=Demo 8 cold calibration NO-RESULT::forced cold calibration did not publish counted path evidence"
              exit 1
            fi
            if [[ "$actual_path_source" != cold-calibration ]] || \
               (( cache_attempted != 0 || cold_attempted == 0 || cold_engaged == 0 || cold_uaf == 0 )); then
              echo "::error title=Demo 8 cold calibration NO-RESULT::forced cold calibration lacks a nonzero counted engagement denominator"
              exit 1
            fi
          fi

      - name: Upload per-demo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermit-demo-sweep-${{ github.event_name }}-${{ github.run_id }}
          path: |
            dev-hermit-demo-suite/demo-sweep-validation.log
            dev-hermit-demo-suite/target/demo-sweep/
            dev-hermit-demo-suite/ignored/qemu-linux/boot-anchor/run-metadata.json
            dev-hermit-demo-suite/ignored/qemu-linux/run-history/*/run-metadata.json
            dev-hermit-demo-suite/ignored/demo07-drgn/
            dev-hermit-demo-suite/ignored/demo08-run/*.txt
            dev-hermit-demo-suite/ignored/demo08-run/*.out
            dev-hermit-demo-suite/ignored/demo08-run/*.tsv
            dev-hermit-demo-suite/demo08-calibration-path.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Escalate every demo red as P0
        if: failure()
        run: |
          echo "::error title=P0 Hermit demo regression::Demos 1-8 failed at exact Hermit SHA $TARGET_SHA. Treat this red as P0 and inspect the per-demo summary and artifacts."
          {
            echo
            echo "## P0 demo-regression escalation"
            echo "**Owner policy: every demo-sweep red is P0 and blocks landing.**"
            echo
            echo "- Hermit commit: \`$TARGET_SHA\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "The exact-SHA run identifies the Hermit commit or PR that introduced the regression."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
