name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows:
      - "CI (GitHub-managed portable)"
      - "CI (privileged)"
      - "P0 Demo Gate (Hermit hot paths)"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to re-evaluate. Dispatch this workflow with ref set to the
          pull request's head branch so the check attaches to its head SHA.
        required: true
        type: string

# This required check is the SOLE required status check on main (branch ruleset
# "main no-bypass gate", 2026-08-02): it accepts an exact PR head when EITHER a
# fully green local validate.sh run applied the locally-validated label, OR the
# GitHub-Actions leg is green -- and GitHub-Actions-green now means the portable
# job AND the privileged job both succeeded, not the portable job alone. The
# independent Reverie-pin lint does not taint this product-test result. Owner
# rationale: GitHub CI flakiness must never block a locally-validated PR, so the
# standalone "Regular tests (GitHub-managed portable)" requirement was folded
# into this gate's GitHub-Actions leg and dropped from the ruleset. Demo-relevant
# changes additionally require the exact-SHA P0 demo gate; local validation never
# bypasses that owner-mandated gate. Merge-group checks inspect their constituent
# PR heads instead of trusting the synthetic queue commit.
#
# The gate is fork-only because facebookexperimental/hermit has no access to the
# fork privileged runners and fork pull requests receive a read-only token in
# that repository. Upstream relies on the GitHub-managed portable Rust job instead.

# Deduplicate superseded runs. Every push/label to a PR re-fires this workflow;
# without cancellation those runs stack in the shared hosted-runner queue (they
# ran ~40 deep on 2026-08-03), so even this ~5s stamp-check waits behind 40-min
# builds and landing stalls. The check is idempotent (it re-reads the current PR
# head state), so cancelling an in-flight PR run is always safe. Cancel ONLY
# pull_request runs; merge_group, workflow_run, and workflow_dispatch runs each
# get a unique group and are never cancelled. Mirrors demo-hot-path.yml.
concurrency:
  group: merge-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

# All merge-gate jobs run on the dedicated `gate` self-hosted runner pool rather
# than `ubuntu-latest`. They are pure control-plane work — `gh api` reads, `jq`,
# a shallow trusted-ref checkout, and one bash lint — with no Rust build, PMU, or
# ptrace needs. On 2026-08-03 the public-repo GitHub-hosted concurrency cap left
# ci-portable's ~34-min build flood saturating the hosted pool, so even this ~5s
# stamp-check queued behind 40-min builds and NOTHING landed. Routing to
# `[self-hosted, gate]` targets an always-idle lightweight runner
# (selected by the `gate` label only) that picks these jobs up in seconds;
# the three PMU runners also carry the `gate` label as fallback, so a single-node
# outage cannot block landing. Because the required-check context is the job name
# (`merge-gate`), changing `runs-on` does not change the ruleset-required check.
jobs:
  refire-on-ci-completion:
    name: refire-on-ci-completion
    if: github.repository == 'rrnewton/hermit' && github.event_name == 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-dispatch the gate for completed portable, privileged, or demo runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            gh-readonly-queue/*)
              echo "Merge-group events evaluate queue commits directly."
              exit 0
              ;;
          esac

          owner="${REPO%%/*}"
          matches="$(
            gh api "repos/${REPO}/pulls?state=open&base=main&head=${owner}:${HEAD_BRANCH}&per_page=10" |
              jq -c --arg sha "$HEAD_SHA" 'map({number, current: (.head.sha == $sha)})'
          )"

          while IFS=$'\t' read -r pr_number current; do
            if [ "$current" != "true" ]; then
              echo "PR #${pr_number} advanced beyond $HEAD_SHA; its newer CI run will re-fire the gate."
              continue
            fi
            gh workflow run merge-gate.yml \
              --repo "$REPO" \
              --ref "$HEAD_BRANCH" \
              -f pr_number="$pr_number"
          done < <(jq -r '.[] | [.number, .current] | @tsv' <<< "$matches")

  invalidate-local-validation:
    name: invalidate-local-validation
    if: >-
      github.repository == 'rrnewton/hermit' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize'
    runs-on: [self-hosted, gate]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the trusted label-strip evidence helper
        uses: actions/checkout@v4
        with:
          # Pin to the trusted base branch, NOT the PR head. This job runs on a
          # self-hosted runner, so executing scripts/label-strip-evidence.sh from
          # PR-controlled code would run arbitrary PR code on our infrastructure.
          # The helper only reads its arguments and calls the GitHub API, so
          # main's copy is the correct and safe version to run.
          ref: main
          persist-credentials: false
      - name: Remove validation and stale approvals inherited from an older PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # A new push invalidates prior sign-off on the previous revision:
          #   - locally-validated: the local test evidence no longer matches HEAD.
          #   - passed-review-{codex,claude}: the reviewers approved an older diff,
          #     so their approval must be re-earned before the core-review-protocol
          #     job (below) will let a post-facto-human-review PR land again.
          labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          cleared=()
          locally_validated_cleared=0
          for stale in locally-validated passed-review-codex passed-review-claude; do
            if grep -Fxq "$stale" <<< "$labels"; then
              gh api --method DELETE \
                "repos/${REPO}/issues/${PR_NUMBER}/labels/${stale}" \
                --silent
              echo "Removed stale ${stale} label from PR #$PR_NUMBER."
              cleared+=("$stale")
              [ "$stale" = locally-validated ] && locally_validated_cleared=1
            fi
          done

          # Preserve the validation record so stripping the label never silently
          # erases WHAT was validated (commit, profile, durable log pointer). The
          # helper is best-effort and always exits 0, so it can never fail this
          # job — merge-gate requires invalidate-local-validation to succeed.
          if [ "$locally_validated_cleared" = 1 ]; then
            bash scripts/label-strip-evidence.sh \
              --pr "$PR_NUMBER" \
              --repo "$REPO" \
              --validated-sha "$BEFORE_SHA" \
              --new-sha "$AFTER_SHA" \
              --labels "${cleared[*]}" \
              --actor "invalidate-local-validation (push synchronize)" \
              --reason "a new push advanced the PR head; local validation applied to the previous head" \
              || echo "label-strip-evidence helper returned non-zero (ignored; best-effort)."
          fi

  core-review-protocol:
    name: core-review-protocol
    if: >-
      github.repository == 'rrnewton/hermit' &&
      github.event_name != 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the review-protocol linter
        uses: actions/checkout@v4
        with:
          # Pin to the trusted base branch, NOT the PR head. This job runs on a
          # self-hosted runner, so checking out PR-controlled code and executing
          # scripts/core-review-protocol-lint.sh from it would run arbitrary PR
          # code on our infrastructure. The linter reads only environment inputs
          # (PR_LABELS/PR_BODY/PR_IS_KVM/PR_NUMBER), so main's copy is the correct
          # and safe version to run — and a PR cannot weaken its own gate by
          # editing the lint script.
          ref: main
          persist-credentials: false
      - name: Enforce the core-change review protocol
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the pull request number(s) this event covers, mirroring the
          # merge-gate job so the same PRs are gated at PR time and in the queue.
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            pr_numbers="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" |
              jq -r 'select(.base.ref == "main") | .number')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pr_numbers="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest { number baseRefName }
                      }
                    }
                  }
                }
              }' | jq -r --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | .pullRequest.number)
                | .[]
              ')"
          fi

          if [ -z "$pr_numbers" ]; then
            echo "No main-branch pull request is associated with $SHA; nothing to enforce."
            exit 0
          fi

          failed=0
          while read -r pr_number; do
            [ -n "$pr_number" ] || continue

            pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
            labels="$(jq -r '.labels[].name' <<< "$pr_json")"
            body="$(jq -r '.body // ""' <<< "$pr_json")"

            # A PR "touches KVM" when a changed file path or a label mentions kvm.
            files="$(gh api "repos/${REPO}/pulls/${pr_number}/files" \
              --paginate --jq '.[].filename' || true)"
            if grep -qiE 'kvm' <<< "$files" || grep -Fixq kvm <<< "$labels"; then
              is_kvm=true
            else
              is_kvm=false
            fi

            if PR_LABELS="$labels" PR_BODY="$body" PR_IS_KVM="$is_kvm" \
               PR_NUMBER="$pr_number" \
               bash scripts/core-review-protocol-lint.sh; then
              :
            else
              failed=1
            fi
          done <<< "$pr_numbers"

          exit "$failed"

  merge-gate:
    name: merge-gate
    needs: [invalidate-local-validation, core-review-protocol]
    if: >-
      always() &&
      github.repository == 'rrnewton/hermit' &&
      github.event_name != 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted gate policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out canonical CI authorities
        uses: actions/checkout@v4
        with:
          repository: rrnewton/dev-hermit
          ref: f9e61247e83bb07c11297541b591606de24a89a8
          path: .dev-hermit-policy
          persist-credentials: false
      - name: Require a passed result or re-dispatch a no-result check
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          INVALIDATION_RESULT: ${{ needs.invalidate-local-validation.result }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PROTOCOL_RESULT: ${{ needs.core-review-protocol.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          classify_check() {
            .dev-hermit-policy/ci-hub/check_outcome.py \
              --status "$1" --conclusion "$2"
          }

          # Prove the exact predicate used by this gate on every invocation.
          [ "$(classify_check completed success)" = PASSED ]
          [ "$(classify_check "" success)" = PASSED ]
          for conclusion in failure timed_out error startup_failure; do
            [ "$(classify_check completed "$conclusion")" = FAILED ]
          done
          for state in \
            completed:cancelled completed:skipped completed:neutral \
            completed:stale completed:action_required queued:none \
            in_progress:none waiting:none requested:none missing:none \
            completed:future_state; do
            status=${state%%:*}
            conclusion=${state#*:}
            [ "$conclusion" != none ] || conclusion=
            [ "$(classify_check "$status" "$conclusion")" = NO_RESULT ]
          done
          echo "Required-check predicate: N=2 PASSED, N=4 FAILED, N=11 NO_RESULT."

          dispatch_file="${RUNNER_TEMP:-/tmp}/merge-gate-redispatch-${GATE_RUN_ID}.tsv"
          : >"$dispatch_file"
          no_result=0

          queue_dispatch() {
            local workflow=$1 head_ref=$2 head_repo=$3 pr_number=$4 head_sha=$5
            no_result=1
            if [ "$head_repo" != "$REPO" ]; then
              echo "::warning::NO_RESULT for PR #$pr_number at $head_sha cannot be dispatched from external head repository $head_repo."
              return
            fi
            printf '%s\t%s\t%s\t%s\n' "$workflow" "$head_ref" "$pr_number" "$head_sha" >>"$dispatch_file"
          }

          dispatch_no_result() {
            sort -u "$dispatch_file" | while IFS=$'\t' read -r workflow head_ref pr_number head_sha; do
              [ -n "$workflow" ] || continue
              echo "NO_RESULT: re-dispatching $workflow for PR #$pr_number at $head_sha (ref=$head_ref)."
              case "$workflow" in
                merge-gate.yml)
                  gh workflow run "$workflow" --repo "$REPO" --ref "$head_ref" \
                    -f pr_number="$pr_number"
                  ;;
                demo-hot-path.yml)
                  gh workflow run "$workflow" --repo "$REPO" --ref "$head_ref" \
                    -f sha="$head_sha"
                  ;;
                *)
                  gh workflow run "$workflow" --repo "$REPO" --ref "$head_ref"
                  ;;
              esac
            done
          }

          cancel_no_result_gate() {
            echo "NO_RESULT blocks landing but is not a failure; cancelling gate run $GATE_RUN_ID after re-dispatch."
            # This job uses `if: always()` so the ordinary /cancel endpoint
            # deliberately leaves it running. force-cancel is required to make
            # the required context conclude CANCELLED rather than later timing
            # out or exiting red.
            gh api --method POST \
              "repos/${REPO}/actions/runs/${GATE_RUN_ID}/force-cancel" --silent
            # GitHub terminates this runner asynchronously. Reaching the end of
            # this loop means force-cancellation itself failed, a gate fault.
            for _ in {1..60}; do sleep 5; done
            echo "::error::Gate cancellation request did not terminate run $GATE_RUN_ID."
            exit 1
          }

          protocol_state=$(classify_check "" "$PROTOCOL_RESULT")
          case "$protocol_state" in
            PASSED) echo "core-review-protocol result: PASSED" ;;
            FAILED)
              echo "::error::Core-change review protocol FAILED (result=$PROTOCOL_RESULT)."
              exit 1
              ;;
            NO_RESULT)
              echo "Core-change review protocol has NO_RESULT (result=$PROTOCOL_RESULT)."
              no_result=1
              ;;
          esac

          if [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ]; then
            invalidation_state=$(classify_check "" "$INVALIDATION_RESULT")
            case "$invalidation_state" in
              PASSED) ;;
              FAILED)
                echo "::error::Local-validation invalidation FAILED."
                exit 1
                ;;
              NO_RESULT)
                echo "Local-validation invalidation has NO_RESULT."
                no_result=1
                ;;
            esac
          fi

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            pull_requests="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" | jq -c '
              [select(.base.ref == "main") | {
                number,
                head: {sha: .head.sha, ref: .head.ref, repo: .head.repo.full_name},
                labels
              }]
            ')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pull_requests="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest {
                          number
                          headRefOid
                          headRefName
                          headRepository { nameWithOwner }
                          baseRefName
                          labels(first: 100) { nodes { name } }
                        }
                      }
                    }
                  }
                }
              }' | jq -c --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | {
                    number: .pullRequest.number,
                    head: {
                      sha: .pullRequest.headRefOid,
                      ref: .pullRequest.headRefName,
                      repo: .pullRequest.headRepository.nameWithOwner
                    },
                    labels: .pullRequest.labels.nodes
                  })
              ')"
          fi

          if [ "$(jq 'length' <<< "$pull_requests")" -eq 0 ]; then
            echo "::error::No main-branch pull request is associated with $SHA."
            exit 1
          fi

          failed=0
          while IFS=$'\t' read -r pr_number head_sha head_ref head_repo locally_validated; do
            if [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
              echo "::error::PR #${pr_number} has no head SHA."
              failed=1
              continue
            fi
            local_pass=false
            if [ "$locally_validated" = true ]; then
              comments_file=$(mktemp)
              if gh api --paginate --slurp \
                   "repos/${REPO}/issues/${pr_number}/comments?per_page=100" \
                   >"$comments_file" &&
                 evidence=$(bash .dev-hermit-policy/ci-hub/validation/verify_receipt.sh \
                   --repo "$REPO" --sha "$head_sha" --comments "$comments_file"); then
                local_pass=true
                echo "PR #${pr_number} has a dereferenced exact-head receipt: ${evidence}"
              else
                echo "::warning::locally-validated on PR #${pr_number} has no immutable counted receipt for exact head ${head_sha}."
              fi
              rm -f -- "$comments_file"
            fi

            runs="$(gh api "repos/${REPO}/actions/workflows/ci-portable.yml/runs?head_sha=${head_sha}&per_page=100")"
            run="$(jq --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}' <<< "$runs")"
            run_id="$(jq -r '.id // ""' <<< "$run")"
            run_status="$(jq -r '.status // "missing"' <<< "$run")"
            run_conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            job_status=$run_status
            job_conclusion=$run_conclusion
            if [ -n "$run_id" ]; then
              jobs="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")"
              regular_job="$(jq '[.jobs[] | select(.name == "Regular tests (GitHub-managed portable)")] | last // {}' <<< "$jobs")"
              if [ "$(jq 'length' <<< "$regular_job")" -gt 0 ]; then
                job_status="$(jq -r '.status // "missing"' <<< "$regular_job")"
                job_conclusion="$(jq -r '.conclusion // ""' <<< "$regular_job")"
              fi
            fi
            portable_state=$(classify_check "$job_status" "$job_conclusion")

            priv_runs="$(gh api "repos/${REPO}/actions/workflows/ci-privileged.yml/runs?head_sha=${head_sha}&per_page=100")"
            priv_run="$(jq --arg sha "$head_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}' <<< "$priv_runs")"
            priv_run_id="$(jq -r '.id // ""' <<< "$priv_run")"
            priv_status="$(jq -r '.status // "missing"' <<< "$priv_run")"
            priv_conclusion="$(jq -r '.conclusion // ""' <<< "$priv_run")"
            if [ -n "$priv_run_id" ]; then
              priv_jobs="$(gh api "repos/${REPO}/actions/runs/${priv_run_id}/jobs?filter=latest&per_page=100")"
              priv_job="$(jq '[.jobs[] | select(.name == "Privileged capability and E2E tests")] | last // {}' <<< "$priv_jobs")"
              if [ "$(jq 'length' <<< "$priv_job")" -gt 0 ]; then
                priv_status="$(jq -r '.status // "missing"' <<< "$priv_job")"
                priv_conclusion="$(jq -r '.conclusion // ""' <<< "$priv_job")"
              fi
            fi
            privileged_state=$(classify_check "$priv_status" "$priv_conclusion")

            if [ "$portable_state" = FAILED ] || [ "$privileged_state" = FAILED ]; then
              echo "::error::Hosted validation FAILED for PR #${pr_number} at $head_sha: portable=$job_status/${job_conclusion:-none} privileged=$priv_status/${priv_conclusion:-none}. Local evidence cannot override a failure."
              failed=1
            elif [ "$portable_state" = PASSED ] && [ "$privileged_state" = PASSED ]; then
              echo "Hosted portable and privileged validation PASSED for PR #${pr_number} at $head_sha."
            elif [ "$local_pass" = true ]; then
              echo "Exact-head full local validation PASSED; it supplies the alternate leg for hosted NO_RESULT on PR #${pr_number}."
            else
              echo "Hosted validation has NO_RESULT for PR #${pr_number}: portable=$job_status/${job_conclusion:-none} privileged=$priv_status/${priv_conclusion:-none}."
              [ "$portable_state" = PASSED ] || queue_dispatch ci-portable.yml "$head_ref" "$head_repo" "$pr_number" "$head_sha"
              [ "$privileged_state" = PASSED ] || queue_dispatch ci-privileged.yml "$head_ref" "$head_repo" "$pr_number" "$head_sha"
            fi

            # Keep this classifier synchronized with demo-hot-path.yml's paths.
            # Match the hot-path globs, then subtract the test trees the demo
            # suite provably never executes. The demo job runs
            # `scripts/super-validate.sh --demos-only` (parent demos 1-8 only)
            # and never runs the Hermit e2e corpus, so nothing under
            # `tests/e2e/**` can change a demo outcome; the standalone
            # `tests/backend-parity/**` parity fixtures are likewise never read.
            # A PR whose only hot-path-matching files live under those trees is
            # NOT a demo hot path, so it does not require the serial P0 gate.
            # Genuinely demo-affecting paths (detcore*/, hermit-cli/, other
            # guest programs under tests/ such as tests/c/**, Cargo.*, and
            # demo-hot-path.yml itself) are NOT subtracted and stay hot.
            files="$(
              gh api "repos/${REPO}/pulls/${pr_number}/files" \
                --paginate --jq '.[].filename'
            )"
            hot_files="$(
              grep -E '^([.]github/workflows/demo-hot-path[.]yml|Cargo[.](lock|toml)|rust-toolchain[.]toml|common/|detcore[^/]*/|examples/|flaky-tests/|hermit-cli/|hermit-install/|hermit-resources/|tests/)' <<< "$files" \
                | grep -vE '^tests/(e2e|backend-parity)/' || true
            )"
            if [ -n "$hot_files" ]; then
              all_runs="$(
                gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100"
              )"
              demo_run="$(jq --arg sha "$head_sha" '
                [.workflow_runs[]
                  | select(
                      .head_sha == $sha
                      and .name == "P0 Demo Gate (Hermit hot paths)"
                    )]
                | sort_by(.created_at)
                | last // {}
              ' <<< "$all_runs")"
              demo_status="$(jq -r '.status // "missing"' <<< "$demo_run")"
              demo_conclusion="$(jq -r '.conclusion // ""' <<< "$demo_run")"
              demo_url="$(jq -r '.html_url // ""' <<< "$demo_run")"

              demo_state=$(classify_check "$demo_status" "$demo_conclusion")
              case "$demo_state" in
                PASSED)
                  echo "P0 demo gate PASSED for hot-path PR #${pr_number} at $head_sha: $demo_url"
                  ;;
                FAILED)
                  echo "::error::P0 demo gate FAILED for hot-path PR #${pr_number} at $head_sha ($demo_status/${demo_conclusion:-none}): ${demo_url:-no run URL}."
                  failed=1
                  ;;
                NO_RESULT)
                  echo "P0 demo gate has NO_RESULT for hot-path PR #${pr_number} at $head_sha ($demo_status/${demo_conclusion:-none})."
                  queue_dispatch demo-hot-path.yml "$head_ref" "$head_repo" "$pr_number" "$head_sha"
                  ;;
              esac
            else
              echo "PR #${pr_number} does not touch a demo hot path; P0 demo gate not required."
            fi
          done < <(jq -r '
            .[]
            | [.number, .head.sha, .head.ref, .head.repo,
               any(.labels[]?; .name == "locally-validated")]
            | @tsv
          ' <<< "$pull_requests")

          if [ "$failed" -ne 0 ]; then
            exit "$failed"
          fi
          if [ "$no_result" -ne 0 ]; then
            # A skipped/cancelled dependency also needs a fresh gate evaluation.
            if [ "$protocol_state" = NO_RESULT ] ||
               { [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ] &&
                 [ "${invalidation_state:-PASSED}" = NO_RESULT ]; }; then
              while IFS=$'\t' read -r pr_number head_sha head_ref head_repo _; do
                queue_dispatch merge-gate.yml "$head_ref" "$head_repo" "$pr_number" "$head_sha"
              done < <(jq -r '.[] | [.number, .head.sha, .head.ref, .head.repo, ""] | @tsv' <<< "$pull_requests")
            fi
            dispatch_no_result
            cancel_no_result_gate
          fi

          echo "Every required leg has a PASSED result."
