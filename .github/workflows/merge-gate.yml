name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows:
      - "CI (GitHub-managed portable)"
      - "P0 Demo Gate (Hermit hot paths)"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to re-evaluate. Dispatch this workflow with ref set to the
          pull request's head branch so the check attaches to its head SHA.
        required: true
        type: string

# This lightweight required check accepts an exact PR head only after the
# repository GitHub-managed portable CI job succeeds. A locally-validated label
# is supporting evidence, never a substitute for a required GitHub check.
# Inventory completeness is checked unconditionally on the synthesized PR +
# current-main tree. The independent Reverie-pin lint does not taint this
# product-test result. Demo-relevant changes
# additionally require the exact-SHA P0 demo gate; local validation never bypasses
# that owner-mandated gate. Privileged CI is an independent bonus signal.
# Merge-group checks inspect their constituent PR heads instead of trusting the
# synthetic queue commit.
#
# The gate is fork-only because facebookexperimental/hermit has no access to the
# fork privileged runners and fork pull requests receive a read-only token in
# that repository. Upstream relies on the GitHub-managed portable Rust job instead.

# Never cancel a required gate run. GitHub can retain an older successful check
# with the same context when a newer run is cancelled, which masks NOT-PASSED as
# mergeable. These control-plane runs are short and use the dedicated gate pool;
# queued duplicates are cheaper than ambiguous required-check state.
concurrency:
  group: merge-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

# Control-plane merge-gate jobs run on the dedicated `gate` self-hosted runner
# pool rather than `ubuntu-latest`. They are pure control-plane work — `gh api` reads, `jq`,
# a shallow trusted-ref checkout, and one bash lint — with no Rust build, PMU, or
# ptrace needs. On 2026-08-03 the public-repo GitHub-hosted concurrency cap left
# ci-portable's ~34-min build flood saturating the hosted pool, so even this ~5s
# stamp-check queued behind 40-min builds and NOTHING landed. Routing to
# `[self-hosted, gate]` targets an always-idle lightweight runner
# (selected by the `gate` label only) that picks these jobs up in seconds;
# the three PMU runners also carry the `gate` label as fallback, so a single-node
# outage cannot block landing. Because the required-check context is the job name
# (`merge-gate`), changing `runs-on` does not change the ruleset-required check.
jobs:
  merge-safety-guards:
    name: Merge safety guards
    if: github.repository == 'rrnewton/hermit' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the synthesized candidate tree
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}
          persist-credentials: false
      - name: Check out the trusted inventory checker
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Prove required checks fail closed
        run: |
          set -euo pipefail
          test_script="$GITHUB_WORKSPACE/trusted/scripts/test-require-check-success.sh"
          if [ ! -x "$test_script" ]; then
            test_script="$GITHUB_WORKSPACE/candidate/scripts/test-require-check-success.sh"
          fi
          test -x "$test_script"
          "$test_script"
      - name: Require a complete test inventory on the merge result
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/trusted/scripts/check-test-inventory.sh"
          # Bootstrap this guard's own PR. Once it lands, every later PR uses
          # main's checker and cannot weaken the audit in its candidate tree.
          if [ ! -x "$checker" ]; then
            checker="$GITHUB_WORKSPACE/candidate/scripts/check-test-inventory.sh"
          fi
          test -x "$checker"
          "$checker" "$GITHUB_WORKSPACE/candidate"

  refire-on-ci-completion:
    name: refire-on-ci-completion
    if: github.repository == 'rrnewton/hermit' && github.event_name == 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-dispatch the gate for completed portable CI or demo runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            gh-readonly-queue/*)
              echo "Merge-group events evaluate queue commits directly."
              exit 0
              ;;
          esac

          owner="${REPO%%/*}"
          matches="$(
            gh api "repos/${REPO}/pulls?state=open&base=main&head=${owner}:${HEAD_BRANCH}&per_page=10" |
              jq -c --arg sha "$HEAD_SHA" 'map({number, current: (.head.sha == $sha)})'
          )"

          while IFS=$'\t' read -r pr_number current; do
            if [ "$current" != "true" ]; then
              echo "PR #${pr_number} advanced beyond $HEAD_SHA; its newer CI run will re-fire the gate."
              continue
            fi
            gh workflow run merge-gate.yml \
              --repo "$REPO" \
              --ref "$HEAD_BRANCH" \
              -f pr_number="$pr_number"
          done < <(jq -r '.[] | [.number, .current] | @tsv' <<< "$matches")

  invalidate-local-validation:
    name: invalidate-local-validation
    if: >-
      github.repository == 'rrnewton/hermit' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize'
    runs-on: [self-hosted, gate]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove validation and stale approvals inherited from an older PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A new push invalidates prior sign-off on the previous revision:
          #   - locally-validated: the local test evidence no longer matches HEAD.
          #   - passed-review-{codex,claude}: the reviewers approved an older diff,
          #     so their approval must be re-earned before the core-review-protocol
          #     job (below) will let a post-facto-human-review PR land again.
          labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          for stale in locally-validated passed-review-codex passed-review-claude; do
            if grep -Fxq "$stale" <<< "$labels"; then
              gh api --method DELETE \
                "repos/${REPO}/issues/${PR_NUMBER}/labels/${stale}" \
                --silent
              echo "Removed stale ${stale} label from PR #$PR_NUMBER."
            fi
          done

  core-review-protocol:
    name: core-review-protocol
    if: >-
      github.repository == 'rrnewton/hermit' &&
      github.event_name != 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the review-protocol linter
        uses: actions/checkout@v4
        with:
          # Pin to the trusted base branch, NOT the PR head. This job runs on a
          # self-hosted runner, so checking out PR-controlled code and executing
          # scripts/core-review-protocol-lint.sh from it would run arbitrary PR
          # code on our infrastructure. The linter reads only environment inputs
          # (PR_LABELS/PR_BODY/PR_IS_KVM/PR_NUMBER), so main's copy is the correct
          # and safe version to run — and a PR cannot weaken its own gate by
          # editing the lint script.
          ref: main
          persist-credentials: false
      - name: Enforce the core-change review protocol
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the pull request number(s) this event covers, mirroring the
          # merge-gate job so the same PRs are gated at PR time and in the queue.
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            pr_numbers="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" |
              jq -r 'select(.base.ref == "main") | .number')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pr_numbers="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest { number baseRefName }
                      }
                    }
                  }
                }
              }' | jq -r --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | .pullRequest.number)
                | .[]
              ')"
          fi

          if [ -z "$pr_numbers" ]; then
            echo "No main-branch pull request is associated with $SHA; nothing to enforce."
            exit 0
          fi

          failed=0
          while read -r pr_number; do
            [ -n "$pr_number" ] || continue

            pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
            labels="$(jq -r '.labels[].name' <<< "$pr_json")"
            body="$(jq -r '.body // ""' <<< "$pr_json")"

            # A PR "touches KVM" when a changed file path or a label mentions kvm.
            files="$(gh api "repos/${REPO}/pulls/${pr_number}/files" \
              --paginate --jq '.[].filename' || true)"
            if grep -qiE 'kvm' <<< "$files" || grep -Fixq kvm <<< "$labels"; then
              is_kvm=true
            else
              is_kvm=false
            fi

            if PR_LABELS="$labels" PR_BODY="$body" PR_IS_KVM="$is_kvm" \
               PR_NUMBER="$pr_number" \
               bash scripts/core-review-protocol-lint.sh; then
              :
            else
              failed=1
            fi
          done <<< "$pr_numbers"

          exit "$failed"

  merge-gate:
    name: merge-gate
    needs: [merge-safety-guards, invalidate-local-validation, core-review-protocol]
    if: >-
      always() &&
      github.repository == 'rrnewton/hermit' &&
      github.event_name != 'workflow_run'
    runs-on: [self-hosted, gate]
    timeout-minutes: 10
    steps:
      - name: Check out trusted gate policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require the core-change review protocol
        env:
          PROTOCOL_RESULT: ${{ needs.core-review-protocol.result }}
        run: |
          set -euo pipefail
          if [ "$PROTOCOL_RESULT" != success ]; then
            echo "::error::Core-change review protocol did not pass (result=$PROTOCOL_RESULT); blocking landing."
            exit 1
          fi
          echo "core-review-protocol result: success"
      - name: Require merge safety guards
        env:
          SAFETY_RESULT: ${{ needs.merge-safety-guards.result }}
        run: |
          set -euo pipefail
          if [ "$SAFETY_RESULT" != success ]; then
            echo "::error::Merge safety guards did not pass (result=$SAFETY_RESULT)."
            exit 1
          fi
          echo "Merge safety guards passed."
      - name: Require successful CI
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          INVALIDATION_RESULT: ${{ needs.invalidate-local-validation.result }}
          PR_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          require_check_success() {
            if [ -x scripts/require-check-success.sh ]; then
              scripts/require-check-success.sh "$@"
              return
            fi
            # Bootstrap this guard's own PR. The trusted main checkout does not
            # contain the helper until this change lands; keep the same exact
            # one-pass-state policy inline for that first run.
            local label=$1 status=${2,,} conclusion=${3,,}
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              echo "$label passed (completed/success)."
              return 0
            fi
            echo "$label is NOT PASSED ($status/${conclusion:-none}); re-run is required." >&2
            return 1
          }

          if [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ] &&
             [ "$INVALIDATION_RESULT" != success ]; then
            echo "::error::Could not invalidate local validation from the previous PR head."
            exit 1
          fi

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = null ]; then
              echo "::error::workflow_dispatch requires a pr_number input."
              exit 1
            fi
            pull_requests="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" | jq -c '
              [select(.base.ref == "main") | {
                number,
                head: {sha: .head.sha},
                labels
              }]
            ')"
          else
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            base_branch="${BASE_REF#refs/heads/}"
            pull_requests="$(
              gh api graphql \
                -f owner="$owner" \
                -f name="$name" \
                -f branch="$base_branch" \
                -f query='query($owner: String!, $name: String!, $branch: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      nodes {
                        headCommit { oid }
                        pullRequest {
                          number
                          headRefOid
                          baseRefName
                          labels(first: 100) { nodes { name } }
                        }
                      }
                    }
                  }
                }
              }' | jq -c --arg sha "$SHA" --arg base "$base_branch" '
                .data.repository.mergeQueue.entries.nodes
                | map(select(
                    .headCommit.oid == $sha
                    and .pullRequest.baseRefName == $base
                  ) | {
                    number: .pullRequest.number,
                    head: {sha: .pullRequest.headRefOid},
                    labels: .pullRequest.labels.nodes
                  })
              ')"
          fi

          if [ "$(jq 'length' <<< "$pull_requests")" -eq 0 ]; then
            echo "::error::No main-branch pull request is associated with $SHA."
            exit 1
          fi

          failed=0
          while IFS=$'\t' read -r pr_number head_sha; do
            if [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
              echo "::error::PR #${pr_number} has no head SHA."
              failed=1
              continue
            fi
            runs="$(
              gh api "repos/${REPO}/actions/workflows/ci-portable.yml/runs?head_sha=${head_sha}&per_page=100"
            )"
            run="$(jq --arg sha "$head_sha" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.created_at)
              | last // {}
            ' <<< "$runs")"
            run_id="$(jq -r '.id // ""' <<< "$run")"
            url="$(jq -r '.html_url // ""' <<< "$run")"

            # Gate on the authoritative product-test job, not the whole run.
            # The same workflow contains the independent `reverie-pin` lint;
            # a stale pin can fail that job while Regular tests are green.
            if [ -z "$run_id" ]; then
              echo "::error::No ci-portable.yml run for PR #${pr_number} at $head_sha."
              failed=1
            else
              jobs="$(
                gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100"
              )"
              regular_job="$(jq '
                [.jobs[] | select(.name == "Regular tests (GitHub-managed portable)")]
                | last // {}
              ' <<< "$jobs")"
              job_status="$(jq -r '.status // "missing"' <<< "$regular_job")"
              job_conclusion="$(jq -r '.conclusion // ""' <<< "$regular_job")"
              job_url="$(jq -r '.html_url // ""' <<< "$regular_job")"

              if require_check_success \
                   "Regular tests for PR #${pr_number} at $head_sha" \
                   "$job_status" "$job_conclusion"; then
                echo "Authoritative portable job: ${job_url:-$url}"
              else
                echo "::error::Required portable job is not passed: ${job_url:-${url:-no run URL}}."
                failed=1
              fi
            fi

            # Keep this classifier synchronized with demo-hot-path.yml's paths.
            files="$(
              gh api "repos/${REPO}/pulls/${pr_number}/files" \
                --paginate --jq '.[].filename'
            )"
            if grep -Eq '^([.]github/workflows/demo-hot-path[.]yml|Cargo[.](lock|toml)|rust-toolchain[.]toml|common/|detcore[^/]*/|examples/|flaky-tests/|hermit-cli/|hermit-install/|hermit-resources/|tests/)' <<< "$files"; then
              all_runs="$(
                gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100"
              )"
              demo_run="$(jq --arg sha "$head_sha" '
                [.workflow_runs[]
                  | select(
                      .head_sha == $sha
                      and .name == "P0 Demo Gate (Hermit hot paths)"
                    )]
                | sort_by(.created_at)
                | last // {}
              ' <<< "$all_runs")"
              demo_status="$(jq -r '.status // "missing"' <<< "$demo_run")"
              demo_conclusion="$(jq -r '.conclusion // ""' <<< "$demo_run")"
              demo_url="$(jq -r '.html_url // ""' <<< "$demo_run")"

              if require_check_success \
                   "P0 demo gate for hot-path PR #${pr_number} at $head_sha" \
                   "$demo_status" "$demo_conclusion"; then
                echo "P0 demo gate passed for hot-path PR #${pr_number} at $head_sha: $demo_url"
              else
                echo "::error::P0 demo gate for hot-path PR #${pr_number} at $head_sha is $demo_status/${demo_conclusion:-none}: ${demo_url:-no run URL}. Every demo red is P0 and blocks landing."
                failed=1
              fi
            else
              echo "PR #${pr_number} does not touch a demo hot path; P0 demo gate not required."
            fi
          done < <(jq -r '
            .[]
            | [.number, .head.sha]
            | @tsv
          ' <<< "$pull_requests")

          exit "$failed"
