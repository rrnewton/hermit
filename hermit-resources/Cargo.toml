[package]
# Third-party backend source trees are never part of the crates.io artifact.
exclude = ["**/vendor/dynamorio/**", "**/vendor/e9patch/**", "**/vendor/sabre/**", "**/vendor/SaBRe/**", "**/third-party/dynamorio/**", "**/third-party/e9patch/**", "**/third-party/sabre/**"]
name = "hermit-resources"
description = "Resource accounting and limit types for the Hermit deterministic execution engine."
version = "0.5.0"
edition = "2024"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/hermit-resources"
keywords = ["linux", "hermit", "determinism", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing"]
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

[lib]
path = "src/lib.rs"
