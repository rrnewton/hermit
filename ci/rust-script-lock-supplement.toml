# Versions for crates that tracked rust-scripts use and the root Cargo.lock does
# not pin.
#
# ci/prepare-rust-scripts.sh builds every rust-script entrypoint in one
# generated Cargo workspace. That workspace cannot have a committed lockfile of
# its own, so the script seeds its lock with the root Cargo.lock plus these
# entries and refuses any registry or git package that neither file pins.
#
# Rules for this file:
#   - Entries use the Cargo.lock [[package]] format: name, version, source,
#     checksum and dependencies, copied from a lock Cargo produced.
#   - Add only crates the root Cargo.lock does not pin. The script refuses an
#     entry compatible with a different Cargo.lock version, because the scripts
#     would then build that crate, and the product crates they compile, with a
#     version the product does not use. When a script needs another version of
#     a crate Cargo.lock pins, move Cargo.lock instead
#     (cargo update -p NAME --precise VERSION).
#   - List one version per crate and compatible range; the script refuses two,
#     because Cargo rather than this file would then choose between them.
#   - A script that requires a version exactly with `=VERSION` still needs its
#     entry here (or in Cargo.lock): a seeded entry keeps the build working even
#     if crates.io yanks the release.
#   - When the script refuses an unpinned crate it writes candidate entries to
#     target/ci/rust-script-lock-supplement.candidate-fetch.toml (fetch mode)
#     or target/ci/rust-script-lock-supplement.candidate-build.toml (build
#     mode). Review them before copying them here.

