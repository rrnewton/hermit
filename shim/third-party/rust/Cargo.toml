# Third-party Rust crates used by hermit's buck2 build.
#
# reindeer reads this manifest and generates BUCK next to it. It is not used by
# the cargo build; hermit's own Cargo.toml files remain the manifest cargo uses.
#
# fbinit is deliberately absent: it is a Meta crate with no crates.io release,
# so the targets that use it cannot build outside Meta.

# Kept out of hermit's cargo workspace: this manifest exists only for reindeer.
[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"
test = false

[dependencies]
addr2line = "0.26.1"
anyhow = "1.0.103"
async-trait = "0.1.86"
bincode = "2"
bitflags = "2.13.1"
bitvec = "1.1.1"
build-time = "=0.1.3"
bytesize = "2.4.2"
chrono = "0.4.45"
clap = "4.6.2"
close-err = "1.0.2"
colored = "2.1.0"
diff = "0.1.13"
dirs = "6.0"
futures = "0.3.31"
goblin = "0.10.7"
hex = "0.4.3"
iced-x86 = "1.21.0"
libc = "0.2.186"
nix = "0.30.1"
num_cpus = "1.16"
object = "0.36.7"
pretty = "0.12.5"
pretty_assertions = "1.4.1"
procfs = "0.18.0"
rand = "0.10.2"
rand_distr = "0.6"
rand_pcg = "0.10.2"
raw-cpuid = "10.7.0"
regex = "1.13.1"
serde = "1.0.219"
serde_json = "1.0.151"
sha2 = "0.10.9"
shell-words = "1.1.1"
similar = "2.2.0"
syscalls = "0.6.7"
tempfile = "3.27.0"
test-case = "3.3.1"
tokio = "1.52.4"
toml = "0.8.23"
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = "1.24.0"
