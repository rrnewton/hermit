# Third-party Rust crates used by hermit's buck2 build.
#
# reindeer reads this manifest and generates BUCK next to it. It is not used by
# the cargo build; hermit's own Cargo.toml files remain the manifest cargo uses.
#
# Covers both hermit and reverie, because they share one shim cell in this tree.
#
# Absent deliberately, none has a crates.io release, so targets using them cannot
# build outside Meta: liteinst2.

# Kept out of hermit's cargo workspace: this manifest exists only for reindeer.
[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"
test = false

[dependencies]
addr2line = "0.26.1"
anyhow = "1.0.103"
async-trait = "0.1.86"
atomic = "0.5.1"
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2.13.1", features = ["serde", "std"] }
bitvec = { version = "1.1.1", features = ["atomic", "serde"] }
build-time = "=0.1.3"
byteorder = "1.5"
bytes = { version = "1.12.1", features = ["serde"] }
bytesize = "2.4.2"
cc = "1.0"
chrono = { version = "0.4.45", features = ["clock", "serde", "std"] }
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
close-err = "1.0.2"
colored = "2.1.0"
darling = "0.14.0"
derive_more = { version = "1.0.0", features = ["full"] }
diff = "0.1.13"
dirs = "6.0"
futures = { version = "0.3.31", features = ["async-await", "compat"] }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
heapless = "0.8.0"
heck = "0.3.1"
hex = { version = "0.4.3", features = ["alloc"] }
iced-x86 = { version = "1.21.0", features = ["decoder", "std"] }
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
lazy_static = "1.4"
libc = "0.2.186"
linked-hash-map = { version = "0.5", features = ["serde_impl"] }
memmap2 = "0.9.11"
mimalloc = "0.1"
never-say-never = "6"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
num-traits = "0.2.19"
num_cpus = "1.16"
object = { version = "0.36.7", features = ["read", "write"] }
parking_lot = { version = "0.12.1", features = ["arc_lock", "send_guard"] }
paste = "1.0.14"
perf-event-open-sys = "5.0"
pretty = "0.12.5"
pretty_assertions = { version = "1.4.1", features = ["alloc"] }
proc-macro2 = { version = "1.0.70", features = ["span-locations"] }
procfs = "0.18.0"
quickcheck = "1.1"
quickcheck_macros = "1.2.0"
quote = "1.0.29"
rand = "0.10.2"
rand_distr = "0.6"
rand_pcg = { version = "0.10.2", features = ["serde"] }
raw-cpuid = "10.7.0"
regex = "1.13.1"
scroll = { version = "0.13", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
sha2 = "0.10.9"
shell-words = "1.1.1"
similar = { version = "2.2.0", features = ["bytes", "inline"] }
syn = { version = "1.0.109", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
syscalls = { version = "0.6.7", features = ["serde"] }
tempfile = "3.27.0"
test-case = "3.3.1"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["full", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time", "tracing"] }
tokio-stream = { version = "0.1.18", features = ["fs", "io-util", "net", "signal", "sync", "time"] }
toml = "0.8.23"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
typed-arena = "2"
uuid = { version = "1.24.0", features = ["rng-getrandom", "serde", "v4", "v5", "v6", "v7", "v8"] }
unwind = { version = "0.4.2", features = ["ptrace"] }
fbinit = "0.2.0"
