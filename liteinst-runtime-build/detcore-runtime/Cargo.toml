[package]
name = "hermit-liteinst-detcore-runtime"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[features]
private-crt = ["reverie-liteinst/private-crt"]

[lib]
name = "hermit_liteinst_detcore"
crate-type = ["cdylib"]

[dependencies]
detcore = { version = "0.2.0", package = "hermit-detcore", path = "../../detcore" }
libc = "0.2.186"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
reverie-liteinst = { package = "reverie-liteinst-runtime", version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "320412c5967790939ebe405c73e394ffd9c41459", default-features = false }
reverie-preload = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "320412c5967790939ebe405c73e394ffd9c41459", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
