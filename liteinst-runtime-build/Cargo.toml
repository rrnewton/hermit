[workspace]
resolver = "3"
members = ["runtime"]
default-members = ["."]

[package]
name = "hermit-liteinst-runtime-build"
version = "0.5.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Adds only the nested leaf's diagnostic exports, never allocator selection.
allocator-fixture = []
# Native-exec artifact construction is outside the 0.5.0 release scope.

[build-dependencies]
reverie-liteinst-artifact = { version = "0.5.0", git = "https://github.com/rrnewton/reverie.git", rev = "edad7ff63ffa11d7866f261a0f508f3e6b79e827", default-features = false }
serde_json = "1.0.151"


[dev-dependencies]
serde_json = "1.0.151"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native-exec"))'] }
